<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Country Battle Live</title>

<style>

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;
  min-height:100%;
  background:#05060c;
  color:white;
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
}

body{overflow-x:hidden;}

.app{
  width:100%;
  max-width:820px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 50% 5%, rgba(70,50,160,.35), transparent 40%),
    linear-gradient(180deg,#07080f 0%,#0d1030 45%,#07080f 100%);
  position:relative;
  padding-bottom:70px;
}

/* ================= HEADER ================= */

.header{
  text-align:center;
  padding:22px 12px 4px;
}

.title{
  font-size:clamp(26px,7vw,50px);
  font-weight:1000;
  letter-spacing:2px;
  color:#ffe75b;
  text-shadow:
    0 0 6px rgba(255,230,70,.85),
    0 0 22px rgba(255,200,0,.4),
    0 0 40px rgba(255,180,0,.2);
}

/* ================= RULES ================= */

.rules{
  margin:12px 20px 14px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  border:1.5px solid rgba(255,225,72,.55);
  border-radius:11px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 14px rgba(255,200,0,.08) inset;
}

.rule{
  font-size:clamp(10px,2.6vw,15px);
  font-weight:900;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}

.rule .icon{font-size:15px;}

.yellow{color:#ffe13b;}

/* ================= TOP 3 PLAYERS ================= */

.top-players{
  display:grid;
  grid-template-columns:1fr 1.12fr 1fr;
  gap:8px;
  align-items:end;
  padding:6px 12px 14px;
}

.player-card{
  position:relative;
  text-align:center;
  padding:10px 6px 12px;
  border-radius:14px;
  background:
    linear-gradient(180deg, rgba(40,42,68,.96), rgba(8,9,18,.98));
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 8px 22px rgba(0,0,0,.55);
  min-width:0;
}

.player-card.rank-1{
  border-color:#ffd92e;
  box-shadow:
    0 0 22px rgba(255,211,36,.5),
    0 8px 22px rgba(0,0,0,.55);
  transform:translateY(-6px);
  padding:12px 6px 14px;
}

.player-card.rank-2{
  border-color:#d5d8e3;
  box-shadow:0 0 14px rgba(210,215,230,.3);
}

.player-card.rank-3{
  border-color:#c48246;
  box-shadow:0 0 14px rgba(190,120,50,.3);
}

.p-crown{
  font-size:22px;
  height:24px;
  line-height:24px;
}

.p-rank-badge{
  position:absolute;
  top:6px;
  right:6px;
  width:22px;
  height:22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:1000;
  border:2px solid white;
  color:white;
}

.rank-1 .p-rank-badge{background:#ed2633;}
.rank-2 .p-rank-badge{background:#9aa0b4;}
.rank-3 .p-rank-badge{background:#b06a30;}

.p-avatar-wrap{
  width:62px;
  height:62px;
  margin:4px auto 6px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(180deg,#2a2c44,#0e0f1c);
  border:2px solid rgba(255,255,255,.5);
  position:relative;
}

.rank-1 .p-avatar-wrap{
  border-color:#ffe338;
  box-shadow:0 0 16px rgba(255,220,50,.65);
  width:68px;
  height:68px;
}

.rank-2 .p-avatar-wrap{border-color:#d5d8e3;}
.rank-3 .p-avatar-wrap{border-color:#c48246;}

.p-avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#171927;
  display:block;
}

.p-avatar-fallback{
  width:100%;
  height:100%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  background:#171927;
}

.p-name{
  margin-top:2px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.p-amount{
  margin-top:3px;
  color:#ffe02f;
  font-size:15px;
  font-weight:1000;
  text-shadow:0 0 8px rgba(255,210,50,.4);
}

.p-country{
  margin-top:5px;
  font-size:10px;
  color:#d6d8e2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.p-country .flag-mini{font-size:14px;}

/* ================= TOP 3 COUNTRIES ================= */

.top-countries-wrap{
  padding:0 12px 12px;
}

.top-countries-title{
  text-align:center;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  color:#8a8fb0;
  margin-bottom:6px;
}

.top-countries{
  display:grid;
  grid-template-columns:1fr 1.12fr 1fr;
  gap:8px;
  align-items:end;
}

.tc-card{
  position:relative;
  text-align:center;
  padding:8px 4px 10px;
  border-radius:10px;
  background:
    linear-gradient(180deg, rgba(30,32,54,.95), rgba(8,9,18,.95));
  border:2px solid rgba(255,255,255,.12);
}

.tc-card.rank-1{
  border-color:#ffd92e;
  box-shadow:0 0 18px rgba(255,211,36,.55);
  transform:translateY(-6px);
}

.tc-card.rank-2{
  border-color:#d5d8e3;
  box-shadow:0 0 12px rgba(210,215,230,.3);
}

.tc-card.rank-3{
  border-color:#c48246;
  box-shadow:0 0 12px rgba(190,120,50,.3);
}

.tc-crown{
  font-size:16px;
  height:18px;
  line-height:18px;
}

.tc-rank-badge{
  position:absolute;
  top:4px;
  left:4px;
  padding:2px 6px;
  border-radius:6px;
  font-size:9px;
  font-weight:1000;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.25);
}

.rank-1 .tc-rank-badge{
  background:#ffd92e;
  color:#111;
  border-color:#fff5b0;
}

.tc-flag-box{
  width:52px;
  height:38px;
  margin:4px auto 5px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:#10121f;
  border:2px solid rgba(255,255,255,.18);
  overflow:hidden;
}

.rank-1 .tc-flag-box{
  border-color:#ffe338;
  box-shadow:0 0 10px rgba(255,220,50,.5);
}

.tc-points{
  font-size:14px;
  font-weight:1000;
  color:#ffe02f;
  text-shadow:0 0 8px rgba(255,210,50,.4);
}

/* ================= EVENT / COMMENT TICKER ================= */

.event-area{
  margin:0 12px 12px;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  border-radius:9px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.12);
}

.event{
  width:100%;
  text-align:center;
  font-size:12.5px;
  font-weight:900;
  line-height:1.4;
}

.event.comment{color:white;}
.event.superchat{
  color:#ffe02c;
  text-shadow:0 0 10px rgba(255,215,0,.4);
}

.event .name{color:#6ee7ff;font-weight:1000;}
.event .country{color:#ffe13b;font-weight:1000;}
.event .points{color:#a8ff8a;font-weight:1000;}

.event .avatar-mini{
  width:20px;
  height:20px;
  border-radius:50%;
  vertical-align:middle;
  margin-right:5px;
  border:1.5px solid rgba(255,255,255,.4);
  object-fit:cover;
}

/* ================= COUNTRY GRID ================= */

.grid-section{
  padding:4px 12px 20px;
}

.country-grid{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:5px;
}

.cell{
  position:relative;
  border-radius:8px;
  padding:4px 2px 6px;
  text-align:center;
  background:
    linear-gradient(180deg, rgba(26,28,48,.95), rgba(8,9,18,.95));
  border:1.5px solid rgba(255,255,255,.08);
  min-width:0;
}

.cell.rank-1{
  border-color:#ffd92e;
  box-shadow:0 0 12px rgba(255,211,36,.55);
}

.cell.rank-2{
  border-color:#d5d8e3;
  box-shadow:0 0 9px rgba(210,215,230,.35);
}

.cell.rank-3{
  border-color:#c48246;
  box-shadow:0 0 9px rgba(190,120,50,.35);
}

.cell-rank{
  position:absolute;
  top:2px;
  left:3px;
  font-size:7.5px;
  font-weight:1000;
  color:#a4a8c0;
}

.cell.rank-1 .cell-rank,
.cell.rank-2 .cell-rank,
.cell.rank-3 .cell-rank{
  color:#ffe13b;
}

.cell-flag{
  font-size:22px;
  line-height:1;
  margin-top:8px;
  display:block;
}

.cell-points{
  margin-top:3px;
  font-size:10px;
  font-weight:1000;
  color:#e6e8f2;
}

.cell.rank-1 .cell-points,
.cell.rank-2 .cell-points,
.cell.rank-3 .cell-points{
  color:#ffe02f;
}

/* ================= CONTROLS ================= */

.controls{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.control{
  border:none;
  padding:9px 13px;
  border-radius:22px;
  background:#202337;
  color:white;
  border:1px solid rgba(255,255,255,.15);
  font-size:10px;
  font-weight:900;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
  cursor:pointer;
}

.control.on{background:#147b4d;}

/* ================= CONNECTION ================= */

.connection{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:999;
  padding:8px 12px;
  border-radius:20px;
  background:#202337;
  border:1px solid rgba(255,255,255,.15);
  font-size:9px;
  font-weight:900;
}

.connection.connected{background:#147b4d;}
.connection.error{background:#8b2020;}

/* ================= RESPONSIVE ================= */

@media(max-width:400px){

  .country-grid{
    grid-template-columns:repeat(7, 1fr);
  }

  .cell-flag{font-size:19px;}
  .cell-points{font-size:9px;}

  .p-avatar-wrap{
    width:54px;height:54px;
  }

  .rank-1 .p-avatar-wrap{
    width:60px;height:60px;
  }

  .p-name{font-size:10px;}
  .p-amount{font-size:13px;}

  .tc-flag-box{
    width:44px;height:32px;font-size:24px;
  }

  .tc-points{font-size:12px;}

  .rules{gap:8px;padding:7px 8px;}
  .rule{font-size:9.5px;}

}

</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="title">TYPE YOUR COUNTRY</div>
  </header>

  <div class="rules">

    <div class="rule">
      <span class="icon">💬</span>
      1 COMMENT = <span class="yellow">1 POINT</span>
    </div>

    <div class="rule">
      <span class="icon">💎</span>
      $1 SUPERCHAT = <span class="yellow">1000 POINTS</span>
    </div>

  </div>


  <!-- TOP 3 PLAYERS -->

  <section class="top-players" id="topPlayers"></section>


  <!-- TOP 3 COUNTRIES -->

  <section class="top-countries-wrap">

    <div class="top-countries-title">🏆 TOP 3 COUNTRIES</div>

    <div class="top-countries" id="topCountries"></div>

  </section>


  <!-- COMMENT TICKER -->

  <div class="event-area">
    <div id="event" class="event">
      Waiting for comments...
    </div>
  </div>


  <!-- ALL COUNTRY GRID -->

  <section class="grid-section">
    <div id="countryGrid" class="country-grid"></div>
  </section>

</div>


<!-- CONTROLS -->

<div class="controls">

  <button id="musicButton" class="control">🎵 MUSIC OFF</button>
  <button id="voiceButton" class="control on">🔊 VOICE ON</button>

</div>


<!-- CONNECTION STATUS -->

<div id="connection" class="connection">🔄 CONNECTING...</div>


<!-- MUSIC -->

<audio id="backgroundMusic" src="/music/background.mp3" loop preload="auto"></audio>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/state";
const POLL_INTERVAL = 2000;


/* =====================================================
   ELEMENTS
===================================================== */

const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");
const voiceButton = document.getElementById("voiceButton");
const eventElement = document.getElementById("event");
const topPlayersEl = document.getElementById("topPlayers");
const topCountriesEl = document.getElementById("topCountries");
const countryGrid = document.getElementById("countryGrid");
const connection = document.getElementById("connection");


/* =====================================================
   STATE
===================================================== */

let musicEnabled = false;
let voiceEnabled = true;
let lastEventId = "";
let firstStateLoaded = false;
let loading = false;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatNumber(v){
  return Number(v || 0).toLocaleString("en-US");
}

function formatUSD(v){
  return "$" + Number(v || 0).toFixed(2);
}

function getCountryName(c){
  if(!c) return "Unknown";
  return c.countryName || c.name || c.country || "Unknown";
}

function getFlag(c){
  if(!c) return "🌍";
  return c.flag || c.countryFlag || c.emoji || "🌍";
}

function getAvatar(p){
  return (
    p.profileImageUrl ||
    p.avatar ||
    ""
  );
}


/* =====================================================
   CONNECTION
===================================================== */

function setConnectionStatus(ok){

  if(ok){
    connection.textContent = "🟢 YOUTUBE CONNECTED";
    connection.classList.add("connected");
    connection.classList.remove("error");
  }else{
    connection.textContent = "🔴 YOUTUBE DISCONNECTED";
    connection.classList.remove("connected");
    connection.classList.add("error");
  }

}


/* =====================================================
   MUSIC
===================================================== */

async function startMusic(){

  try{
    music.volume = 0.12;
    await music.play();
    musicEnabled = true;
    musicButton.textContent = "🎵 MUSIC ON";
    musicButton.classList.add("on");
    return true;
  }catch(e){
    musicEnabled = false;
    musicButton.textContent = "🎵 MUSIC OFF";
    musicButton.classList.remove("on");
    return false;
  }

}

window.addEventListener("load", () => {
  setTimeout(() => { startMusic(); }, 500);
});

musicButton.addEventListener("click", async () => {
  if(music.paused || !musicEnabled){
    await startMusic();
  }else{
    music.pause();
    musicEnabled = false;
    musicButton.textContent = "🎵 MUSIC OFF";
    musicButton.classList.remove("on");
  }
});


/* =====================================================
   VOICE
===================================================== */

voiceButton.addEventListener("click", () => {

  voiceEnabled = !voiceEnabled;

  if(!voiceEnabled){
    if("speechSynthesis" in window) speechSynthesis.cancel();
    voiceButton.textContent = "🔇 VOICE OFF";
    voiceButton.classList.remove("on");
  }else{
    voiceButton.textContent = "🔊 VOICE ON";
    voiceButton.classList.add("on");
  }

});

function speak(text){

  if(!voiceEnabled) return;
  if(!("speechSynthesis" in window)) return;

  try{
    speechSynthesis.cancel();

    if(musicEnabled && !music.paused){
      music.volume = 0.035;
    }

    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    u.pitch = 1;
    u.volume = 1;

    u.onend = u.onerror = () => {
      if(musicEnabled && !music.paused){
        music.volume = 0.12;
      }
    };

    speechSynthesis.speak(u);

  }catch(e){
    console.error("VOICE ERROR:", e);
  }

}


/* =====================================================
   ANNOUNCE EVENT
===================================================== */

function announceEvent(event){

  if(!event || !event.id) return;

  if(!firstStateLoaded){
    lastEventId = event.id;
    return;
  }

  if(event.id === lastEventId) return;

  lastEventId = event.id;

  const name = event.displayName || "Someone";
  const country = event.countryName || event.country || "";
  const points = Number(event.points || 0);

  if(event.type === "superchat"){

    const amount = Number(event.amountMicros || 0) / 1000000;
    const currency = event.currency || "USD";

    speak(
      `Super Chat from ${name}. ` +
      `${country}. ` +
      `${amount.toFixed(2)} ${currency}. ` +
      `${formatNumber(points)} points.`
    );

    return;
  }

  if(event.type === "comment"){
    if(points > 0){
      speak(`${name}. ${country}. ${formatNumber(points)} point.`);
    }else{
      speak(`${name} commented.`);
    }
  }

}


/* =====================================================
   RENDER EVENT (comment ticker)
===================================================== */

function renderEvent(event){

  if(!event || !event.id){
    eventElement.className = "event";
    eventElement.textContent = "Waiting for comments...";
    return;
  }

  const name = event.displayName || "Someone";
  const country = event.countryName || event.country || "";
  const points = Number(event.points || 0);
  const avatar = event.profileImageUrl || "";

  const avatarHTML = avatar
    ? `<img class="avatar-mini" src="${escapeHtml(avatar)}" alt="" onerror="this.style.display='none'">`
    : "";

  if(event.type === "superchat"){

    const amount = Number(event.amountMicros || 0) / 1000000;
    const currency = event.currency || "USD";

    eventElement.className = "event superchat";

    eventElement.innerHTML = `
      💎 ${avatarHTML}
      <span class="name">${escapeHtml(name)}</span>
      sent <strong>${amount.toFixed(2)} ${escapeHtml(currency)}</strong>
      · <span class="points">${formatNumber(points)} POINTS</span>
      ${country ? `· <span class="country">${escapeHtml(country)}</span>` : ""}
    `;

    return;
  }

  eventElement.className = "event comment";

  if(points > 0){

    eventElement.innerHTML = `
      💬 ${avatarHTML}
      <span class="name">${escapeHtml(name)}</span>
      ${country ? `· <span class="country">${escapeHtml(country)}</span>` : ""}
      · <span class="points">+${formatNumber(points)} POINT</span>
    `;

  }else{

    eventElement.innerHTML = `
      💬 ${avatarHTML}
      <span class="name">${escapeHtml(name)}</span>
      commented
    `;

  }

}


/* =====================================================
   RENDER TOP 3 PLAYERS
   Layout: [2nd] [1st] [3rd]
===================================================== */

function renderTopPlayers(players){

  const list = Array.isArray(players) ? players : [];

  const sorted = [...list]
    .filter(p => p && (Number(p.amount || 0) > 0 || Number(p.score || 0) > 0))
    .sort((a,b) => {
      const da = Number(a.amount || 0);
      const db = Number(b.amount || 0);
      if(db !== da) return db - da;
      return Number(b.score || 0) - Number(a.score || 0);
    })
    .slice(0,3);

  const positions = [1,0,2];
  const classes   = ["rank-2","rank-1","rank-3"];
  const crowns    = ["♛","👑","♛"];
  const rankNums  = [2,1,3];

  let html = "";

  for(let slot=0; slot<3; slot++){

    const p = sorted[positions[slot]];
    const cls = classes[slot];
    const crn = crowns[slot];
    const rn  = rankNums[slot];

    if(!p){
      html += `
        <div class="player-card ${cls}">
          <div class="p-rank-badge">${rn}</div>
          <div class="p-crown">${crn}</div>
          <div class="p-avatar-wrap">
            <div class="p-avatar-fallback">👤</div>
          </div>
          <div class="p-name">Waiting...</div>
          <div class="p-amount">$0.00</div>
          <div class="p-country">—</div>
        </div>
      `;
      continue;
    }

    const avatar = getAvatar(p);
    const name = p.displayName || "Player";
    const amount = Number(p.amount || 0);
    const flag = getFlag(p);
    const countryName = getCountryName(p);

    const avatarHTML = avatar
      ? `<img class="p-avatar" src="${escapeHtml(avatar)}" alt="" onerror="this.outerHTML='<div class=\\'p-avatar-fallback\\'>👤</div>'">`
      : `<div class="p-avatar-fallback">👤</div>`;

    html += `
      <div class="player-card ${cls}">
        <div class="p-rank-badge">${rn}</div>
        <div class="p-crown">${crn}</div>
        <div class="p-avatar-wrap">
          ${avatarHTML}
        </div>
        <div class="p-name">${escapeHtml(name)}</div>
        <div class="p-amount">${formatUSD(amount)}</div>
        <div class="p-country">
          <span class="flag-mini">${escapeHtml(flag)}</span>
          <span>${escapeHtml(countryName)}</span>
        </div>
      </div>
    `;
  }

  topPlayersEl.innerHTML = html;

}


/* =====================================================
   RENDER TOP 3 COUNTRIES
   Layout: [2nd] [1st] [3rd]
===================================================== */

function renderTopCountries(countries){

  const list = Array.isArray(countries) ? countries : [];

  const sorted = [...list]
    .map(c => ({
      ...c,
      score:Number(c.score ?? c.po
