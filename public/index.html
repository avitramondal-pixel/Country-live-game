<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Country Battle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      text-align: center;
      padding: 20px 10px;
      background: #191919;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .rules {
      margin-top: 8px;
      color: #ccc;
      font-size: 14px;
    }

    .board {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 50px 1fr 100px;
      align-items: center;
      gap: 8px;

      background: #202020;
      margin-bottom: 8px;
      padding: 12px;

      border-radius: 10px;
    }

    .rank {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .country {
      font-size: 18px;
      font-weight: bold;
    }

    .commenter {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    .score {
      text-align: right;
      font-size: 24px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🌎 COUNTRY BATTLE</h1>

    <div class="rules">
      Comment = +1 &nbsp; • &nbsp; Super Chat = +10
    </div>
  </div>

  <div class="board" id="board">
    <div class="empty">
      Waiting for country comments...
    </div>
  </div>

  <script>
    const names = {
      India: "🇮🇳 India",
      Bangladesh: "🇧🇩 Bangladesh",
      Pakistan: "🇵🇰 Pakistan",
      Nepal: "🇳🇵 Nepal",
      Bhutan: "🇧🇹 Bhutan",
      SriLanka: "🇱🇰 Sri Lanka",
      China: "🇨🇳 China",
      Japan: "🇯🇵 Japan",
      SouthKorea: "🇰🇷 South Korea",
      Indonesia: "🇮🇩 Indonesia",
      Malaysia: "🇲🇾 Malaysia",
      Singapore: "🇸🇬 Singapore",
      Thailand: "🇹🇭 Thailand",
      Vietnam: "🇻🇳 Vietnam",
      Philippines: "🇵🇭 Philippines",
      Australia: "🇦🇺 Australia",
      Canada: "🇨🇦 Canada",
      USA: "🇺🇸 USA",
      Mexico: "🇲🇽 Mexico",
      Brazil: "🇧🇷 Brazil",
      Argentina: "🇦🇷 Argentina",
      UK: "🇬🇧 UK",
      France: "🇫🇷 France",
      Germany: "🇩🇪 Germany",
      Italy: "🇮🇹 Italy",
      Spain: "🇪🇸 Spain",
      Portugal: "🇵🇹 Portugal",
      Netherlands: "🇳🇱 Netherlands",
      Russia: "🇷🇺 Russia",
      Turkey: "🇹🇷 Turkey",
      SaudiArabia: "🇸🇦 Saudi Arabia",
      SouthAfrica: "🇿🇦 South Africa",
      Nigeria: "🇳🇬 Nigeria",
      Egypt: "🇪🇬 Egypt"
    };

    async function updateBoard() {
      try {
        const response = await fetch("/api/state");
        const data = await response.json();

        const board = document.getElementById("board");

        if (!data.leaderboard.length) {
          board.innerHTML =
            '<div class="empty">Waiting for country comments...</div>';
          return;
        }

        board.innerHTML = data.leaderboard
          .map((item, index) => `
            <div class="row">

              <div class="rank">
                ${index + 1}
              </div>

              <div>
                <div class="country">
                  ${names[item.country] || item.country}
                </div>

                <span class="commenter">
                  ${item.latestCommenter
                    ? "Latest: " + escapeHtml(item.latestCommenter)
                    : ""}
                </span>
              </div>

              <div class="score">
                ${item.score}
              </div>

            </div>
          `)
          .join("");

      } catch (error) {
        console.error(error);
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    updateBoard();

    setInterval(updateBoard, 1000);
  </script>

</body>
</html>
