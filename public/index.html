<!DOCTYPE html>
<html>
<head>
  <title>Country Battle Live</title>
  <link rel="stylesheet" href="style.css">   ← এখানে CSS আসে
</head>
<body>

  <!-- Title -->
  <h1>TYPE YOUR COUNTRY</h1>

  <!-- Rules -->
  💬 1 COMMENT = 1 POINT
  💎 $1 SUPERCHAT = 1000 POINTS

  <!-- Top 3 Players container -->
  <div id="topPlayers"></div>       ← JS এখানে কার্ড বসাবে

  <!-- Top 3 Countries container -->
  <div id="topCountries"></div>     ← JS এখানে কার্ড বসাবে

  <!-- Event banner -->
  <div id="eventBanner">Waiting...</div>

  <!-- Country grid container -->
  <div id="countryGrid"></div>      ← JS এখানে ১৯৫ দেশ বসাবে

  <!-- Buttons -->
  <button>🎵 MUSIC OFF</button>
  <button>🔊 VOICE ON</button>

  <!-- Connection status -->
  <div id="connectionBadge">🔄 CONNECTING...</div>

  <script src="script.js"></script>   ← এখানে JS আসে
</body>
</html>
