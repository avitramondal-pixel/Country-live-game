<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Country Live Battle</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background:
    radial-gradient(
      circle at top,
      #18233b,
      #05070d 65%
    );

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;

}

.container {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 15px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  margin-bottom: 15px;

}

.header h1 {

  margin: 5px 0;

  font-size: 28px;

}

.header p {

  margin: 0;

  opacity: .65;

}


/* =====================================================
   VOICE BUTTON
===================================================== */

.voice-panel {

  display: flex;

  justify-content: center;

  gap: 10px;

  margin: 15px 0;

}

.voice-button {

  border: 0;

  padding: 12px 22px;

  border-radius: 30px;

  background: #1d8cff;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

.voice-button.off {

  background: #444;

}


/* =====================================================
   TOP 3
===================================================== */

.top-title {

  text-align: center;

  font-size: 22px;

  font-weight: bold;

  margin: 18px 0 10px;

}


.top3 {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

}


.top-card {

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.04)
    );

  border: 1px solid
    rgba(255,255,255,.12);

  border-radius: 16px;

  padding: 15px 8px;

  text-align: center;

  min-height: 130px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.25);

}


.top-card.first {

  transform:
    translateY(-8px);

}


.rank {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 5px;

}

.flag {

  font-size: 38px;

  line-height: 1.1;

  margin: 5px 0;

}

.country-name {

  font-size: 15px;

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.points {

  margin-top: 5px;

  font-size: 20px;

  font-weight: 900;

}


/* =====================================================
   LAST EVENT
===================================================== */

.event-box {

  margin-top: 18px;

  background:
    rgba(255,255,255,.06);

  border: 1px solid
    rgba(255,255,255,.12);

  border-radius: 15px;

  padding: 15px;

  text-align: center;

}

.event-name {

  font-size: 20px;

  font-weight: bold;

}

.event-country {

  margin-top: 7px;

  font-size: 17px;

}

.event-points {

  margin-top: 7px;

  font-size: 22px;

  font-weight: bold;

}


/* =====================================================
   SUPER CHAT
===================================================== */

.superchat {

  border:
    1px solid #ffd700;

  box-shadow:
    0 0 20px
    rgba(255,215,0,.2);

}


/* =====================================================
   LEADERBOARD
===================================================== */

.leaderboard {

  margin-top: 20px;

}

.leader-title {

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 10px;

}


.country-row {

  display: flex;

  align-items: center;

  gap: 10px;

  background:
    rgba(255,255,255,.05);

  border-radius: 10px;

  padding: 9px 12px;

  margin-bottom: 5px;

}


.country-rank {

  width: 35px;

  font-weight: bold;

  color: #aaa;

}


.country-flag {

  font-size: 25px;

  width: 35px;

}


.country-info {

  flex: 1;

  min-width: 0;

}


.country-name-small {

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.country-player {

  font-size: 12px;

  opacity: .6;

  margin-top: 2px;

}


.country-score {

  font-size: 18px;

  font-weight: bold;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

  .container {

    padding: 10px;

  }

  .header h1 {

    font-size: 23px;

  }

  .top3 {

    gap: 6px;

  }

  .top-card {

    padding: 10px 5px;

    min-height: 115px;

  }

  .flag {

    font-size: 31px;

  }

  .country-name {

    font-size: 12px;

  }

  .points {

    font-size: 18px;

  }

}

</style>

</head>


<body>

<div class="container">


  <div class="header">

    <h1>
      🌍 COUNTRY LIVE BATTLE
    </h1>

    <p>
      Comment a country name to give it 1 point
    </p>

  </div>


  <!-- VOICE -->

  <div class="voice-panel">

    <button
      id="voiceButton"
      class="voice-button"
      onclick="enableVoice()"
    >
      🔊 ENABLE VOICE
    </button>

  </div>


  <!-- TOP 3 -->

  <div class="top-title">

    🏆 TOP 3 COUNTRIES

  </div>


  <div
    id="top3"
    class="top3"
  ></div>


  <!-- LAST EVENT -->

  <div
    id="eventBox"
    class="event-box"
  >

    <div class="event-name">
      Waiting for comments...
    </div>

    <div class="event-country">
      🌍
    </div>

    <div class="event-points">
      0 POINTS
    </div>

  </div>


  <!-- LEADERBOARD -->

  <div class="leaderboard">

    <div class="leader-title">
      🌎 ALL COUNTRIES
    </div>

    <div
      id="leaderboard"
    ></div>

  </div>


</div>


<script>

/* =====================================================
   VOICE SYSTEM
===================================================== */

let voiceEnabled = false;

let voiceQueue = [];

let speaking = false;

let lastSpokenEventId = "";


/* =====================================================
   ENABLE VOICE
===================================================== */

function enableVoice() {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "Voice is not supported by this browser."
    );

    return;

  }


  voiceEnabled = true;


  const button =
    document.getElementById(
      "voiceButton"
    );

  button.textContent =
    "🔊 VOICE ON";

  button.classList.remove(
    "off"
  );


  /* Browser permission / unlock */

  const test =
    new SpeechSynthesisUtterance(
      "Voice is now enabled."
    );

  test.lang = "en-US";

  test.rate = 0.9;

  test.volume = 1;

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    test
  );

}


/* =====================================================
   SELECT ENGLISH VOICE
===================================================== */

function getBestVoice() {

  const voices =
    window.speechSynthesis
      .getVoices();

  if (!voices.length) {
    return null;
  }


  const preferred = [

    "Google US English",

    "Microsoft David",

    "Microsoft Mark",

    "Samantha",

    "Alex"

  ];


  for (
    const name
    of preferred
  ) {

    const found =
      voices.find(
        voice =>
          voice.name
            .toLowerCase()
            .includes(
              name.toLowerCase()
            )
      );

    if (found) {
      return found;
    }

  }


  return (
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("en")
    ) ||
    voices[0]
  );

}


window.speechSynthesis.onvoiceschanged =
  function() {

    window.speechSynthesis
      .getVoices();

  };


/* =====================================================
   ADD VOICE
===================================================== */

function queueVoice(text) {

  if (!voiceEnabled) {
    return;
  }

  if (!text) {
    return;
  }


  voiceQueue.push(text);

  speakNext();

}


/* =====================================================
   SPEAK NEXT
===================================================== */

function speakNext() {

  if (!voiceEnabled) {
    return;
  }

  if (speaking) {
    return;
  }

  if (!voiceQueue.length) {
    return;
  }


  const text =
    voiceQueue.shift();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang = "en-US";

  utterance.rate = 0.85;

  utterance.pitch = 1;

  utterance.volume = 1;


  const voice =
    getBestVoice();

  if (voice) {
    utterance.voice =
      voice;
  }


  speaking = true;


  utterance.onend =
    function() {

      speaking = false;

      setTimeout(
        speakNext,
        150
      );

    };


  utterance.onerror =
    function() {

      speaking = false;

      setTimeout(
        speakNext,
        150
      );

    };


  window.speechSynthesis
    .speak(utterance);

}


/* =====================================================
   COUNTRY VOICE
===================================================== */

function speakEvent(event) {

  if (!voiceEnabled) {
    return;
  }

  if (!event) {
    return;
  }

  if (!event.hasCountry) {
    return;
  }


  if (
    event.id ===
    lastSpokenEventId
  ) {

    return;

  }


  lastSpokenEventId =
    event.id;


  let text = "";


  /* NORMAL COMMENT */

  if (
    event.type ===
    "comment"
  ) {

    text =
      `${event.displayName} ` +
      `${event.countryName} ` +
      `${event.points} point`;

  }


  /* SUPER CHAT */

  else if (
    event.type ===
    "superchat"
  ) {

    const amount =
      Number(event.amount || 0);

    const money =
      amount > 0
        ? `${amount.toFixed(2)} ${event.currency || "USD"}`
        : "";

    text =
      `${event.displayName} ` +
      `${event.countryName} ` +
      `${money} ` +
      `${event.points} points`;

  }


  if (text) {
    queueVoice(text);
  }

}


/* =====================================================
   FORMAT POINT
===================================================== */

function formatPoints(points) {

  return Number(
    points || 0
  ).toLocaleString();

}


/* =====================================================
   TOP 3
===================================================== */

function renderTop3(top3) {

  const container =
    document.getElementById(
      "top3"
    );


  if (
    !top3 ||
    !top3.length
  ) {

    container.innerHTML = `

      <div class="top-card">
        <div class="rank">🥇 1ST</div>
        <div class="flag">🌍</div>
        <div class="country-name">
          Waiting...
        </div>
        <div class="points">
          0
        </div>
      </div>

      <div class="top-card">
        <div class="rank">🥈 2ND</div>
        <div class="flag">🌍</div>
        <div class="country-name">
          Waiting...
        </div>
        <div class="points">
          0
        </div>
      </div>

      <div class="top-card">
        <div class="rank">🥉 3RD</div>
        <div class="flag">🌍</div>
        <div class="country-name">
          Waiting...
        </div>
        <div class="points">
          0
        </div>
      </div>

    `;

    return;
  }


  const ranks = [
    "🥇 1ST",
    "🥈 2ND",
    "🥉 3RD"
  ];


  let html = "";


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const country =
      top3[i];


    if (!country) {

      html += `

        <div class="top-card">

          <div class="rank">
            ${ranks[i]}
          </div>

          <div class="flag">
            🌍
          </div>

          <div class="country-name">
            Waiting...
          </div>

          <div class="points">
            0
          </div>

        </div>

      `;

      continue;
    }


    html += `

      <div
        class="top-card ${
          i === 0
            ? "first"
            : ""
        }"
      >

        <div class="rank">
          ${ranks[i]}
        </div>

        <div class="flag">
          ${country.flag}
        </div>

        <div class="country-name">
          ${escapeHtml(
            country.countryName
          )}
        </div>

        <div class="points">
          ${formatPoints(
            country.score
          )}
        </div>

      </div>

    `;
  }


  container.innerHTML =
    html;
}


/* =====================================================
   LAST EVENT
===================================================== */

function renderEvent(event) {

  const box =
    document.getElementById(
      "eventBox"
    );


  if (
    !event ||
    !event.hasCountry
  ) {

    box.className =
      "event-box";

    box.innerHTML = `

      <div class="event-name">
        Waiting for a country comment...
      </div>

      <div class="event-country">
        🌍
      </div>

      <div class="event-points">
        0 POINTS
      </div>

    `;

    return;
  }


  if (
    event.type ===
    "superchat"
  ) {

    box.className =
      "event-box superchat";


    const amount =
      Number(event.amount || 0);


    const money =
      amount > 0
        ? `${amount.toFixed(2)} ${
            event.currency || "USD"
          }`
        : "";


    box.innerHTML = `

      <div class="event-name">
        💰 ${escapeHtml(
          event.displayName
        )}
      </div>

      <div class="event-country">

        ${event.flag}

        ${escapeHtml(
          event.countryName
        )}

      </div>

      <div class="event-points">

        ${money}
        +
        ${formatPoints(
          event.points
        )}
        POINTS

      </div>

    `;

  } else {

    box.className =
      "event-box";


    box.innerHTML = `

      <div class="event-name">

        ${escapeHtml(
          event.displayName
        )}

      </div>

      <div class="event-country">

        ${event.flag}

        ${escapeHtml(
          event.countryName
        )}

      </div>

      <div class="event-points">

        +
        ${formatPoints(
          event.points
        )}
        POINT

      </div>

    `;
  }
}


/* =====================================================
   LEADERBOARD
===================================================== */

function renderLeaderboard(
  countries
) {

  const container =
    document.getElementById(
      "leaderboard"
    );


  let html = "";


  countries.forEach(
    (country, index) => {

      html += `

        <div class="country-row">

          <div class="country-rank">
            ${index + 1}
          </div>

          <div class="country-flag">
            ${country.flag}
          </div>

          <div class="country-info">

            <div
              class="country-name-small"
            >
              ${escapeHtml(
                country.countryName
              )}
            </div>

            <div
              class="country-player"
            >
              ${
                country.latestCommenter
                  ? "Last: " +
                    escapeHtml(
                      country.latestCommenter
                    )
                  : ""
              }
            </div>

          </div>

          <div class="country-score">

            ${formatPoints(
              country.score
            )}

          </div>

        </div>

      `;
    }
  );


  container.innerHTML =
    html;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   LOAD DATA
===================================================== */

let firstLoad = true;


async function loadData() {

  try {

    const response =
      await fetch(
        "/api/state?time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {
      return;
    }


    renderTop3(
      data.top3 || []
    );


    renderLeaderboard(
      data.countries || []
    );


    if (
      data.lastEvent &&
      data.lastEvent.id
    ) {

      renderEvent(
        data.lastEvent
      );


      if (
        !firstLoad
      ) {

        speakEvent(
          data.lastEvent
        );

      }

    }

    firstLoad = false;


  } catch (error) {

    console.error(
      "LOAD ERROR:",
      error
    );

  }

}


/* =====================================================
   START
===================================================== */

loadData();


setInterval(
  loadData,
  1000
);

</script>

</body>

</html>
