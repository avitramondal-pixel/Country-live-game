<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
/>

<title>Country Live Leaderboard</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:12px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:12px;
}

.title{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  color:#aaa;
  font-size:13px;
}

.voice-box{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  text-align:center;
}

.voice-status{
  font-size:13px;
  margin-bottom:8px;
  color:#bbb;
}

.voice-button{
  border:0;
  border-radius:10px;
  padding:12px 20px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  background:#fff;
  color:#000;
}

.voice-button.enabled{
  background:#19d66b;
  color:#000;
}

.voice-button:active{
  transform:scale(.97);
}


/* TOP 3 */

.top3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.top-card{
  background:linear-gradient(
    145deg,
    #171717,
    #090909
  );

  border:1px solid #303030;
  border-radius:16px;
  padding:14px 8px;
  text-align:center;
  min-height:135px;
}

.top-position{
  font-size:13px;
  color:#aaa;
  font-weight:700;
}

.top-flag{
  font-size:42px;
  line-height:1.1;
  margin:6px 0;
}

.top-country{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-score{
  font-size:22px;
  font-weight:900;
  margin-top:5px;
}

.top-card.first{
  border:2px solid #ffd700;
}

.top-card.second{
  border:2px solid #aaa;
}

.top-card.third{
  border:2px solid #cd7f32;
}


/* LAST EVENT */

.event-box{
  background:#111;
  border-radius:16px;
  border:1px solid #292929;
  padding:15px;
  margin-bottom:18px;
}

.event-title{
  font-size:12px;
  color:#888;
  text-transform:uppercase;
  font-weight:800;
  margin-bottom:8px;
}

.event-content{
  display:flex;
  align-items:center;
  gap:10px;
}

.event-flag{
  font-size:35px;
}

.event-name{
  font-size:18px;
  font-weight:900;
}

.event-country{
  color:#bbb;
  font-size:14px;
  margin-top:2px;
}

.event-points{
  margin-left:auto;
  font-size:20px;
  font-weight:900;
}


/* LEADERBOARD */

.section-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.country-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.country-row{
  display:flex;
  align-items:center;
  gap:9px;
  background:#101010;
  border:1px solid #222;
  border-radius:12px;
  padding:10px;
}

.rank{
  width:28px;
  color:#777;
  font-weight:900;
  text-align:center;
}

.flag{
  width:38px;
  font-size:27px;
  text-align:center;
}

.country-info{
  flex:1;
  min-width:0;
}

.country-name{
  font-size:14px;
  font-weight:800;
}

.country-player{
  color:#777;
  font-size:11px;
  margin-top:2px;
}

.country-score{
  font-size:17px;
  font-weight:900;
  min-width:70px;
  text-align:right;
}

.empty{
  text-align:center;
  color:#666;
  padding:30px 10px;
}


/* MOBILE */

@media(max-width:600px){

  body{
    padding:8px;
  }

  .title{
    font-size:23px;
  }

  .top3{
    gap:6px;
  }

  .top-card{
    padding:10px 5px;
    min-height:120px;
  }

  .top-flag{
    font-size:34px;
  }

  .top-country{
    font-size:12px;
  }

  .top-score{
    font-size:18px;
  }

  .event-name{
    font-size:15px;
  }

  .event-points{
    font-size:17px;
  }

  .country-score{
    min-width:55px;
  }
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="title">
      🌍 COUNTRY LIVE BATTLE
    </div>

    <div class="subtitle">
      Comment your country to earn points
    </div>

  </div>


  <!-- VOICE -->

  <div class="voice-box">

    <div
      id="voiceStatus"
      class="voice-status"
    >
      Voice is OFF
    </div>

    <button
      id="voiceButton"
      class="voice-button"
      onclick="enableVoice()"
    >
      🔊 ENABLE VOICE
    </button>

  </div>


  <!-- TOP 3 -->

  <div
    id="top3"
    class="top3"
  ></div>


  <!-- LAST EVENT -->

  <div class="event-box">

    <div class="event-title">
      Latest Activity
    </div>

    <div
      id="eventContent"
      class="event-content"
    >

      <div class="event-flag">
        🌍
      </div>

      <div>

        <div class="event-name">
          Waiting for comments...
        </div>

        <div class="event-country">
          —
        </div>

      </div>

    </div>

  </div>


  <!-- LEADERBOARD -->

  <div class="section-title">
    🌎 ALL COUNTRIES
  </div>

  <div
    id="countryList"
    class="country-list"
  >

    <div class="empty">
      Waiting for live data...
    </div>

  </div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let lastEventId = "";

let voiceEnabled = false;

let voices = [];

let voiceQueue = [];

let speaking = false;

let firstLoad = true;


/* =====================================================
   LOAD BROWSER VOICES
===================================================== */

function loadVoices(){

  if (
    !("speechSynthesis" in window)
  ){
    setVoiceStatus(
      "❌ Browser voice is not supported"
    );

    return;
  }

  voices =
    window.speechSynthesis
      .getVoices();

  console.log(
    "Available voices:",
    voices
  );
}


/* Chrome/Android often loads voices asynchronously */

if (
  "speechSynthesis" in window
){

  window.speechSynthesis
    .onvoiceschanged =
    loadVoices;

  loadVoices();
}


/* =====================================================
   VOICE STATUS
===================================================== */

function setVoiceStatus(text){

  const el =
    document.getElementById(
      "voiceStatus"
    );

  if(el){
    el.textContent = text;
  }
}


/* =====================================================
   FIND BEST ENGLISH VOICE
===================================================== */

function getBestVoice(){

  if(!voices.length){

    voices =
      window.speechSynthesis
        .getVoices();
  }

  if(!voices.length){
    return null;
  }


  /* Prefer Google English */

  let voice =
    voices.find(v =>
      /Google US English/i
        .test(v.name)
    );

  if(voice) return voice;


  /* Prefer English US */

  voice =
    voices.find(v =>
      /^en-US/i
        .test(v.lang)
    );

  if(voice) return voice;


  /* Any English */

  voice =
    voices.find(v =>
      /^en/i
        .test(v.lang)
    );

  if(voice) return voice;


  /* Last available voice */

  return voices[0];
}


/* =====================================================
   ENABLE VOICE
===================================================== */

function enableVoice(){

  if (
    !("speechSynthesis" in window)
  ){

    setVoiceStatus(
      "❌ This browser does not support voice"
    );

    return;
  }


  voiceEnabled = true;


  const button =
    document.getElementById(
      "voiceButton"
    );

  button.classList.add(
    "enabled"
  );

  button.textContent =
    "🔊 VOICE ENABLED";


  setVoiceStatus(
    "Voice is ready"
  );


  /* Unlock speech engine */

  try{

    window.speechSynthesis.cancel();

    const unlock =
      new SpeechSynthesisUtterance(
        "Voice enabled"
      );

    unlock.volume = 0.01;
    unlock.rate = 1;
    unlock.pitch = 1;

    const voice =
      getBestVoice();

    if(voice){
      unlock.voice = voice;
    }

    window.speechSynthesis
      .speak(unlock);

  }catch(error){

    console.error(
      "Voice unlock error:",
      error
    );
  }


  /* Test after user click */

  setTimeout(() => {

    speakText(
      "Voice is ready"
    );

  }, 300);
}


/* =====================================================
   ADD VOICE TO QUEUE
===================================================== */

function speakText(text){

  if(!voiceEnabled){
    return;
  }

  if(!text){
    return;
  }

  voiceQueue.push(
    String(text)
  );

  processVoiceQueue();
}


/* =====================================================
   PROCESS VOICE QUEUE
===================================================== */

function processVoiceQueue(){

  if(!voiceEnabled){
    return;
  }

  if(speaking){
    return;
  }

  if(!voiceQueue.length){
    return;
  }


  if(
    !("speechSynthesis" in window)
  ){

    setVoiceStatus(
      "❌ Speech not supported"
    );

    return;
  }


  const text =
    voiceQueue.shift();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  const voice =
    getBestVoice();

  if(voice){
    utterance.voice = voice;
    utterance.lang =
      voice.lang || "en-US";
  }else{
    utterance.lang = "en-US";
  }


  utterance.rate = 0.92;
  utterance.pitch = 1;
  utterance.volume = 1;


  utterance.onstart = () => {

    speaking = true;

    setVoiceStatus(
      "🔊 Speaking..."
    );
  };


  utterance.onend = () => {

    speaking = false;

    setVoiceStatus(
      "Voice is ready"
    );

    setTimeout(
      processVoiceQueue,
      80
    );
  };


  utterance.onerror = (error) => {

    console.error(
      "Speech error:",
      error
    );

    speaking = false;

    setVoiceStatus(
      "⚠️ Voice error - retrying"
    );


    /* Retry remaining queue */

    setTimeout(
      processVoiceQueue,
      300
    );
  };


  try{

    window.speechSynthesis
      .speak(utterance);

  }catch(error){

    console.error(
      "Speech synthesis error:",
      error
    );

    speaking = false;

    setTimeout(
      processVoiceQueue,
      500
    );
  }
}


/* =====================================================
   CREATE COMMENT VOICE
===================================================== */

function makeCommentVoice(event){

  const name =
    event.displayName ||
    "Someone";

  const country =
    event.countryName ||
    "unknown country";

  const points =
    Number(event.points || 0);


  return (
    name +
    " from " +
    country +
    " gets " +
    points +
    (points === 1
      ? " point."
      : " points.")
  );
}


/* =====================================================
   CREATE SUPER CHAT VOICE
===================================================== */

function makeSuperChatVoice(event){

  const name =
    event.displayName ||
    "Someone";

  const country =
    event.countryName ||
    "unknown country";

  const amount =
    Number(event.amount || 0);

  const currency =
    event.currency ||
    "USD";

  const points =
    Number(event.points || 0);


  return (
    name +
    " from " +
    country +
    " sent " +
    amount.toFixed(2) +
    " " +
    currency +
    " and gets " +
    points +
    (points === 1
      ? " point."
      : " points.")
  );
}


/* =====================================================
   HANDLE EVENT
===================================================== */

function handleEvent(event){

  if(!event){
    return;
  }


  /* Ignore events without a country */

  if(
    !event.hasCountry ||
    !event.countryName
  ){
    return;
  }


  if(
    event.type === "superchat"
  ){

    showEvent(event);


    if(voiceEnabled){

      const text =
        makeSuperChatVoice(
          event
        );

      speakText(text);
    }

    return;
  }


  if(
    event.type === "comment"
  ){

    showEvent(event);


    if(voiceEnabled){

      const text =
        makeCommentVoice(
          event
        );

      speakText(text);
    }
  }
}


/* =====================================================
   SHOW EVENT
===================================================== */

function showEvent(event){

  const content =
    document.getElementById(
      "eventContent"
    );

  if(!content){
    return;
  }


  const flag =
    event.flag || "🌍";

  const name =
    event.displayName ||
    "Anonymous";

  const country =
    event.countryName ||
    "";


  let pointsText =
    "";

  if(
    event.type === "superchat"
  ){

    const amount =
      Number(event.amount || 0);

    pointsText =
      `${amount.toFixed(2)} ${event.currency || "USD"} • +${event.points}`;

  }else{

    pointsText =
      `+${event.points} POINT${event.points === 1 ? "" : "S"}`;
  }


  content.innerHTML = `

    <div class="event-flag">
      ${escapeHtml(flag)}
    </div>

    <div>

      <div class="event-name">
        ${escapeHtml(name)}
      </div>

      <div class="event-country">
        ${escapeHtml(country)}
      </div>

    </div>

    <div class="event-points">
      ${escapeHtml(pointsText)}
    </div>

  `;
}


/* =====================================================
   RENDER TOP 3
===================================================== */

function renderTop3(top3){

  const container =
    document.getElementById(
      "top3"
    );

  if(!container){
    return;
  }


  const positions = [
    "🥇 1ST",
    "🥈 2ND",
    "🥉 3RD"
  ];


  const classes = [
    "first",
    "second",
    "third"
  ];


  let html = "";


  for(let i = 0; i < 3; i++){

    const country =
      top3[i];


    if(!country){

      html += `

        <div class="top-card ${classes[i]}">

          <div class="top-position">
            ${positions[i]}
          </div>

          <div class="top-flag">
            —
          </div>

          <div class="top-country">
            Waiting...
          </div>

          <div class="top-score">
            0
          </div>

        </div>

      `;

      continue;
    }


    html += `

      <div class="top-card ${classes[i]}">

        <div class="top-position">
          ${positions[i]}
        </div>

        <div class="top-flag">
          ${escapeHtml(country.flag)}
        </div>

        <div class="top-country">
          ${escapeHtml(country.countryName)}
        </div>

        <div class="top-score">
          ${Number(country.score || 0).toLocaleString()}
        </div>

      </div>

    `;
  }


  container.innerHTML = html;
}


/* =====================================================
   RENDER COUNTRIES
===================================================== */

function renderCountries(countries){

  const container =
    document.getElementById(
      "countryList"
    );

  if(!container){
    return;
  }


  if(!countries || !countries.length){

    container.innerHTML =
      `<div class="empty">
        Waiting for live data...
      </div>`;

    return;
  }


  let html = "";


  countries.forEach(
    (country,index) => {

      html += `

        <div class="country-row">

          <div class="rank">
            ${index + 1}
          </div>

          <div class="flag">
            ${escapeHtml(country.flag)}
          </div>

          <div class="country-info">

            <div class="country-name">
              ${escapeHtml(country.countryName)}
            </div>

            <div class="country-player">

              ${
                country.latestCommenter
                  ? "Last: " +
                    escapeHtml(
                      country.latestCommenter
                    )
                  : "No comments yet"
              }

            </div>

          </div>

          <div class="country-score">
            ${Number(country.score || 0).toLocaleString()}
          </div>

        </div>

      `;
    }
  );


  container.innerHTML = html;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =====================================================
   LOAD STATE
===================================================== */

async function loadState(){

  try{

    const response =
      await fetch(
        "/api/state",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(!data.success){
      return;
    }


    renderTop3(
      data.top3 || []
    );


    renderCountries(
      data.countries || []
    );


    /*
      On first page load we DO NOT
      speak old event.
    */

    if(
      firstLoad
    ){

      if(
        data.lastEvent &&
        data.lastEvent.id
      ){

        lastEventId =
          data.lastEvent.id;

        showEvent(
          data.lastEvent
        );
      }

      firstLoad = false;

    }

  }catch(error){

    console.error(
      "STATE ERROR:",
      error
    );
  }
}


/* =====================================================
   CHECK NEW EVENTS
===================================================== */

async function checkEvents(){

  try{

    const url =
      lastEventId
        ? "/api/events?after=" +
          encodeURIComponent(
            lastEventId
          )
        : "/api/events";


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !data.success
    ){
      return;
    }


    const events =
      data.events || [];


    for(
      const event
      of events
    ){

      if(
        event.id ===
        lastEventId
      ){
        continue;
      }


      lastEventId =
        event.id;


      handleEvent(
        event
      );
    }

  }catch(error){

    console.error(
      "EVENT ERROR:",
      error
    );
  }
}


/* =====================================================
   START
===================================================== */

loadState();

setInterval(
  loadState,
  1500
);

setInterval(
  checkEvents,
  800
);


/* =====================================================
   KEEP SPEECH ENGINE ALIVE
===================================================== */

setInterval(() => {

  if(
    voiceEnabled &&
    "speechSynthesis" in window &&
    speaking
  ){

    /*
      Some mobile browsers stop
      long-running speech engines.
    */

    if(
      window.speechSynthesis.paused
    ){

      window.speechSynthesis.resume();
    }
  }

}, 5000);

</script>

</body>
</html>
