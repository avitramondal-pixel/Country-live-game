<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Battle Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:#05060c;color:#fff;font-family:Arial,Helvetica,sans-serif;}
body{overflow-x:hidden;}
.app{
  width:100%;max-width:820px;min-height:100vh;margin:auto;
  background:radial-gradient(circle at 50% 5%,rgba(70,50,160,.35),transparent 40%),
             linear-gradient(180deg,#07080f 0%,#0d1030 45%,#07080f 100%);
  padding-bottom:90px;padding-top:20px;
}
.header{text-align:center;padding:12px 12px 4px;}
.title{
  font-size:clamp(26px,7vw,50px);font-weight:1000;letter-spacing:2px;
  color:#ffe75b;text-shadow:0 0 6px rgba(255,230,70,.85),0 0 22px rgba(255,200,0,.4);
}
.rules{
  margin:12px 20px 20px;padding:9px 12px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  border:1.5px solid rgba(255,225,72,.55);border-radius:11px;background:rgba(0,0,0,.55);
}
.rule{font-size:clamp(10px,2.6vw,15px);font-weight:900;white-space:nowrap;}
.yellow{color:#ffe13b;}
.section-title{
  text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;
  color:#8a8fb0;margin:20px 0 32px;
}
.top-players-wrap{padding:0 8px;}
.top-players{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:4px;align-items:end;}
.player-card{
  position:relative;text-align:center;padding:34px 6px 40px;border-radius:12px;
  background:linear-gradient(180deg,rgba(20,22,40,.98),rgba(6,7,15,.98));
  border:3px solid #666;min-width:0;
}
.player-card.rank-1{border-color:#ffd32e;background:linear-gradient(180deg,rgba(60,45,10,.65),rgba(20,14,4,.98));box-shadow:0 0 30px rgba(255,200,20,.7);transform:translateY(-10px);}
.player-card.rank-2{border-color:#d8dbe6;background:linear-gradient(180deg,rgba(50,55,80,.55),rgba(14,16,28,.98));box-shadow:0 0 22px rgba(220,225,240,.55);}
.player-card.rank-3{border-color:#d08a4a;background:linear-gradient(180deg,rgba(60,32,10,.55),rgba(20,10,4,.98));box-shadow:0 0 22px rgba(210,130,60,.55);}
.p-crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:36px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,220,60,.85));z-index:3;}
.rank-2 .p-crown{font-size:30px;top:-22px;filter:drop-shadow(0 0 10px rgba(200,220,255,.85));}
.rank-3 .p-crown{font-size:28px;top:-20px;filter:drop-shadow(0 0 10px rgba(255,160,80,.85));}
.p-rank-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:1000;border:2px solid #fff;color:#fff;z-index:4;}
.rank-1 .p-rank-badge{background:linear-gradient(180deg,#ffd93a,#b47d00);color:#2a1a00;border-color:#fff5b0;}
.rank-2 .p-rank-badge{background:linear-gradient(180deg,#e8eaf2,#8a8fa5);color:#111;}
.rank-3 .p-rank-badge{background:linear-gradient(180deg,#e29a54,#8a4d15);color:#fff;}
.p-avatar-wrap{width:78px;height:78px;margin:6px auto 8px;border-radius:50%;padding:4px;background:radial-gradient(circle at 50% 30%,#3a3d5a,#0a0b18);border:3px solid #999;overflow:hidden;position:relative;}
.rank-1 .p-avatar-wrap{border-color:#ffd93a;width:86px;height:86px;box-shadow:0 0 18px rgba(255,210,40,.85);}
.rank-2 .p-avatar-wrap{border-color:#dfe2ec;box-shadow:0 0 14px rgba(220,230,255,.7);}
.rank-3 .p-avatar-wrap{border-color:#dd9655;box-shadow:0 0 14px rgba(255,150,70,.7);}
.p-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#171927;display:block;}
.p-avatar-fallback{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(180deg,#1e2038,#0a0b18);color:#4a4d66;}
.p-name{margin-top:6px;font-size:11.5px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-amount{margin-top:4px;font-size:16px;font-weight:1000;color:#ffe23a;}
.p-country{margin-top:6px;font-size:9.5px;color:#d6d8e2;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 6px;border-radius:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);margin-left:auto;margin-right:auto;max-width:90%;white-space:nowrap;overflow:hidden;}
.p-country .flag-mini{font-size:13px;}

.top-countries-wrap{padding:0 8px;}
.top-countries{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:4px;align-items:end;}
.tc-card{position:relative;text-align:center;padding:28px 6px 32px;border-radius:10px;border:3px solid #666;min-width:0;background:linear-gradient(180deg,rgba(20,22,40,.98),rgba(6,7,15,.98));}
.tc-card.rank-1{border-color:#ffd32e;background:linear-gradient(180deg,rgba(60,45,10,.6),rgba(20,14,4,.98));box-shadow:0 0 26px rgba(255,200,20,.65);transform:translateY(-8px);}
.tc-card.rank-2{border-color:#d8dbe6;background:linear-gradient(180deg,rgba(50,55,80,.5),rgba(14,16,28,.98));box-shadow:0 0 20px rgba(220,225,240,.5);}
.tc-card.rank-3{border-color:#d08a4a;background:linear-gradient(180deg,rgba(60,32,10,.5),rgba(20,10,4,.98));box-shadow:0 0 20px rgba(210,130,60,.5);}
.tc-crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:30px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,220,60,.85));z-index:3;}
.rank-2 .tc-crown{font-size:26px;top:-19px;}
.rank-3 .tc-crown{font-size:24px;top:-17px;}
.tc-rank-badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:1000;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);color:#fff;}
.rank-1 .tc-rank-badge{background:linear-gradient(180deg,#ffd93a,#b47d00);color:#2a1a00;border-color:#fff5b0;}
.rank-2 .tc-rank-badge{background:linear-gradient(180deg,#e8eaf2,#8a8fa5);color:#111;}
.rank-3 .tc-rank-badge{background:linear-gradient(180deg,#e29a54,#8a4d15);color:#fff;}
.tc-flag-box{width:64px;height:46px;margin:6px auto 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(circle at 50% 30%,#232642,#05060e);border:2px solid #666;overflow:hidden;}
.rank-1 .tc-flag-box{border-color:#ffd93a;box-shadow:0 0 14px rgba(255,210,40,.85);}
.rank-2 .tc-flag-box{border-color:#dfe2ec;box-shadow:0 0 12px rgba(220,230,255,.65);}
.rank-3 .tc-flag-box{border-color:#dd9655;box-shadow:0 0 12px rgba(255,150,70,.65);}
.tc-points{font-size:16px;font-weight:1000;padding:3px 8px;border-radius:8px;display:inline-block;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:#ffe23a;}

.event-area{margin:24px 12px 14px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);}
.event{width:100%;text-align:center;font-size:12.5px;font-weight:900;line-height:1.4;}
.event.superchat{color:#ffe02c;}
.event .name{color:#6ee7ff;}
.event .country{color:#ffe13b;}
.event .points{color:#a8ff8a;}
.event .avatar-mini{width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:5px;border:1.5px solid rgba(255,255,255,.4);object-fit:cover;}

.grid-section{padding:4px 12px 20px;}
.country-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.cell{position:relative;border-radius:8px;padding:4px 2px 6px;text-align:center;background:linear-gradient(180deg,rgba(26,28,48,.95),rgba(8,9,18,.95));border:1.5px solid rgba(255,255,255,.08);min-width:0;}
.cell.rank-1{border-color:#ffd92e;box-shadow:0 0 12px rgba(255,211,36,.55);}
.cell.rank-2{border-color:#d5d8e3;}
.cell.rank-3{border-color:#c48246;}
.cell-rank{position:absolute;top:2px;left:3px;font-size:7.5px;font-weight:1000;color:#a4a8c0;}
.cell.rank-1 .cell-rank,.cell.rank-2 .cell-rank,.cell.rank-3 .cell-rank{color:#ffe13b;}
.cell-flag{font-size:22px;line-height:1;margin-top:8px;display:block;}
.cell-points{margin-top:3px;font-size:10px;font-weight:1000;color:#e6e8f2;}

.controls{position:fixed;right:12px;bottom:12px;z-index:999;display:flex;flex-direction:column;gap:7px;}
.control{border:none;padding:9px 13px;border-radius:22px;background:#202337;color:#fff;border:1px solid rgba(255,255,255,.15);font-size:10px;font-weight:900;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.5);}
.control.on{background:#147b4d;}
.connection{position:fixed;left:12px;bottom:12px;z-index:999;padding:8px 12px;border-radius:20px;background:#202337;border:1px solid rgba(255,255,255,.15);font-size:9px;font-weight:900;}
.connection.connected{background:#147b4d;}
.connection.error{background:#8b2020;}

#errorBox{position:fixed;top:0;left:0;right:0;background:#b00;color:#fff;padding:8px 12px;font-size:11px;z-index:99999;display:none;}
</style>
</head>
<body>

<div id="errorBox"></div>

<div class="app">
  <div class="header"><div class="title">TYPE YOUR COUNTRY</div></div>
  <div class="rules">
    <div class="rule">💬 1 COMMENT = <span class="yellow">1 POINT</span></div>
    <div class="rule">💎 $1 SUPERCHAT = <span class="yellow">1000 POINTS</span></div>
  </div>
  <div class="section-title">🏆 TOP 3 PLAYERS</div>
  <div class="top-players-wrap"><div class="top-players" id="topPlayers"></div></div>
  <div class="section-title">🏆 TOP 3 COUNTRIES</div>
  <div class="top-countries-wrap"><div class="top-countries" id="topCountries"></div></div>
  <div class="event-area"><div id="event" class="event">Waiting for comments...</div></div>
  <div class="grid-section"><div id="countryGrid" class="country-grid"></div></div>
</div>

<div class="controls">
  <button id="musicButton" class="control">🎵 MUSIC OFF</button>
  <button id="voiceButton" class="control on">🔊 VOICE ON</button>
</div>
<div id="connection" class="connection">🔄 CONNECTING...</div>
<audio id="backgroundMusic" src="/music/background.mp3" loop preload="auto"></audio>

<script>
/* ===== ERROR DISPLAY ===== */
window.onerror = function(msg, url, line){
  var e = document.getElementById("errorBox");
  if(e){
    e.style.display = "block";
    e.textContent = "JS ERROR: " + msg + " (line " + line + ")";
  }
  return false;
};

/* ===== COUNTRY CODES ===== */
var CODES = [
"AF","AL","DZ","AD","AO","AG","AR","AM","AU","AT","AZ",
"BS","BH","BD","BB","BY","BE","BZ","BJ","BT","BO","BA","BW","BR","BN","BG","BF","BI",
"CV","KH","CM","CA","CF","TD","CL","CN","CO","KM","CG","CD","CR","CI","HR","CU","CY","CZ",
"DK","DJ","DM","DO","EC","EG","SV","GQ","ER","EE","SZ","ET",
"FJ","FI","FR","GA","GM","GE","DE","GH","GR","GD","GT","GN","GW","GY",
"HT","HN","HU","IS","IN","ID","IR","IQ","IE","IL","IT",
"JM","JP","JO","KZ","KE","KI","KW","KG","LA","LV","LB","LS","LR","LY","LI","LT","LU",
"MG","MW","MY","MV","ML","MT","MH","MR","MU","MX","FM","MD","MC","MN","ME","MA","MZ","MM",
"NA","NR","NP","NL","NZ","NI","NE","NG","KP","MK","NO","OM",
"PK","PW","PS","PA","PG","PY","PE","PH","PL","PT","QA",
"RO","RU","RW","KN","LC","VC","WS","SM","ST","SA","SN","RS","SC","SL","SG","SK","SI","SB","SO","ZA","KR","SS","ES","LK","SD","SR","SE","CH","SY",
"TJ","TZ","TH","TL","TG","TO","TT","TN","TR","TM","TV",
"UG","UA","AE","GB","US","UY","UZ",
"VU","VA","VE","VN","YE","ZM","ZW"
];

var NAMES = [
"Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan",
"Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi",
"Cape Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Democratic Republic of the Congo","Costa Rica","Cote d'Ivoire","Croatia","Cuba","Cyprus","Czechia",
"Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia",
"Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana",
"Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy",
"Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg",
"Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar",
"Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman",
"Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar",
"Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria",
"Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Türkiye","Turkmenistan","Tuvalu",
"Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan",
"Vanuatu","Holy See","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"
];

function flagOf(code){
  var f = "";
  for(var i = 0; i < code.length; i++){
    f += String.fromCodePoint(127397 + code.toUpperCase().charCodeAt(i));
  }
  return f;
}

/* ===== MASTER LIST ===== */
var master = [];
for(var i = 0; i < CODES.length; i++){
  master.push({
    key: NAMES[i].replace(/[^a-zA-Z0-9]+/g, ""),
    name: NAMES[i],
    flag: flagOf(CODES[i]),
    score: 0
  });
}

/* ===== ELEMENTS ===== */
var musicEl = document.getElementById("backgroundMusic");
var musicBtn = document.getElementById("musicButton");
var voiceBtn = document.getElementById("voiceButton");
var eventEl = document.getElementById("event");
var topPlayersEl = document.getElementById("topPlayers");
var topCountriesEl = document.getElementById("topCountries");
var gridEl = document.getElementById("countryGrid");
var connEl = document.getElementById("connection");

var voiceEnabled = true;
var musicEnabled = false;
var lastEventId = "";
var firstLoad = false;
var busy = false;
var countries = master.slice();

/* ===== HELPERS ===== */
function esc(s){
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(n){ return Number(n || 0).toLocaleString("en-US"); }
function usd(n){ return "$" + Number(n || 0).toFixed(2); }

/* ===== RENDER TOP 3 PLAYERS ===== */
function drawPlayers(list){
  if(!topPlayersEl) return;

  var sorted = (list || []).filter(function(p){
    return p && (Number(p.amount || 0) > 0 || Number(p.score || 0) > 0);
  }).sort(function(a, b){
    var da = Number(a.amount || 0), db = Number(b.amount || 0);
    if(db !== da) return db - da;
    return Number(b.score || 0) - Number(a.score || 0);
  }).slice(0, 3);

  var order = [1, 0, 2];
  var cls = ["rank-2", "rank-1", "rank-3"];
  var rank = [2, 1, 3];
  var html = "";

  for(var s = 0; s < 3; s++){
    var p = sorted[order[s]];
    var c = cls[s];
    var r = rank[s];

    if(!p){
      html += '<div class="player-card ' + c + '">'
        + '<div class="p-crown">👑</div>'
        + '<div class="p-rank-badge">' + r + '</div>'
        + '<div class="p-avatar-wrap"><div class="p-avatar-fallback">👤</div></div>'
        + '<div class="p-name">Waiting...</div>'
        + '<div class="p-amount">$0.00</div>'
        + '<div class="p-country">— — —</div>'
        + '</div>';
      continue;
    }

    var av = p.profileImageUrl
      ? '<img class="p-avatar" src="' + esc(p.profileImageUrl) + '" alt="">'
      : '<div class="p-avatar-fallback">👤</div>';

    html += '<div class="player-card ' + c + '">'
      + '<div class="p-crown">👑</div>'
      + '<div class="p-rank-badge">' + r + '</div>'
      + '<div class="p-avatar-wrap">' + av + '</div>'
      + '<div class="p-name">' + esc(p.displayName || "Player") + '</div>'
      + '<div class="p-amount">' + usd(p.amount) + '</div>'
      + '<div class="p-country"><span class="flag-mini">' + esc(p.flag || "🌍") + '</span><span>' + esc(p.countryName || "Unknown") + '</span></div>'
      + '</div>';
  }
  topPlayersEl.innerHTML = html;
}

/* ===== RENDER TOP 3 COUNTRIES ===== */
function drawTopCountries(list){
  if(!topCountriesEl) return;

  var sorted = (list || []).map(function(x){
    return { name: x.countryName, flag: x.flag, score: Number(x.score || 0) };
  }).filter(function(x){ return x.score > 0; })
    .sort(function(a, b){ return b.score - a.score; })
    .slice(0, 3);

  var order = [1, 0, 2];
  var cls = ["rank-2", "rank-1", "rank-3"];
  var rank = [2, 1, 3];
  var html = "";

  for(var s = 0; s < 3; s++){
    var c = sorted[order[s]];
    var cl = cls[s];
    var r = rank[s];

    if(!c){
      html += '<div class="tc-card ' + cl + '">'
        + '<div class="tc-crown">👑</div>'
        + '<div class="tc-rank-badge">#' + r + '</div>'
        + '<div class="tc-flag-box">🏳️</div>'
        + '<div class="tc-points">0</div>'
        + '</div>';
      continue;
    }
    html += '<div class="tc-card ' + cl + '">'
      + '<div class="tc-crown">👑</div>'
      + '<div class="tc-rank-badge">#' + r + '</div>'
      + '<div class="tc-flag-box">' + esc(c.flag) + '</div>'
      + '<div class="tc-points">' + fmt(c.score) + '</div>'
      + '</div>';
  }
  topCountriesEl.innerHTML = html;
}

/* ===== RENDER COUNTRY GRID ===== */
function drawGrid(list){
  if(!gridEl) return;

  var sorted = (list || countries).slice().map(function(x){
    return { name: x.countryName, flag: x.flag, score: Number(x.score || 0) };
  }).sort(function(a, b){
    if(b.score !== a.score) return b.score - a.score;
    return String(a.name).localeCompare(String(b.name));
  });

  var html = "";
  for(var i = 0; i < sorted.length; i++){
    var r = i + 1;
    var rc = r === 1 ? "rank-1" : r === 2 ? "rank-2" : r === 3 ? "rank-3" : "";
    html += '<div class="cell ' + rc + '">'
      + '<div class="cell-rank">#' + r + '</div>'
      + '<div class="cell-flag">' + esc(sorted[i].flag) + '</div>'
      + '<div class="cell-points">' + fmt(sorted[i].score) + '</div>'
      + '</div>';
  }
  gridEl.innerHTML = html;
}

/* ===== RENDER EVENT ===== */
function drawEvent(ev){
  if(!eventEl) return;
  if(!ev || !ev.id){
    eventEl.className = "event";
    eventEl.textContent = "Waiting for comments...";
    return;
  }
  var n = ev.displayName || "Someone";
  var co = ev.countryName || "";
  var pts = Number(ev.points || 0);
  var av = ev.profileImageUrl ? '<img class="avatar-mini" src="' + esc(ev.profileImageUrl) + '" alt="">' : "";

  if(ev.type === "superchat"){
    var amt = Number(ev.amountMicros || 0) / 1000000;
    eventEl.className = "event superchat";
    eventEl.innerHTML = '💎 ' + av + '<span class="name">' + esc(n) + '</span> sent <strong>' + amt.toFixed(2) + ' ' + esc(ev.currency || "USD") + '</strong> · <span class="points">' + fmt(pts) + ' POINTS</span>' + (co ? ' · <span class="country">' + esc(co) + '</span>' : "");
    return;
  }
  eventEl.className = "event comment";
  if(pts > 0){
    eventEl.innerHTML = '💬 ' + av + '<span class="name">' + esc(n) + '</span>' + (co ? ' · <span class="country">' + esc(co) + '</span>' : "") + ' · <span class="points">+' + fmt(pts) + ' POINT</span>';
  } else {
    eventEl.innerHTML = '💬 ' + av + '<span class="name">' + esc(n) + '</span> commented';
  }
}

/* ===== CONNECTION ===== */
function setConn(ok){
  if(!connEl) return;
  if(ok){
    connEl.textContent = "🟢 YOUTUBE CONNECTED";
    connEl.classList.add("connected");
    connEl.classList.remove("error");
  } else {
    connEl.textContent = "🔴 YOUTUBE DISCONNECTED";
    connEl.classList.remove("connected");
    connEl.classList.add("error");
  }
}

/* ===== MUSIC ===== */
function tryMusic(){
  try{
    musicEl.volume = 0.
