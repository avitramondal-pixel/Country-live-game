<p>

  </div>  <!-- =================================================

  ================================================== -->  <div class="voice-panel"><button
  id="voiceButton"
  class="voice-button"

>

</button>

  </div>  <div

  </div>  <!-- =================================================

  ================================================== -->  <div class="top-title">

<div class="event-country">

</div>

</div>

  </div>  <!-- =================================================

  🌎 ALL COUNTRIES
</div>

<div
  id="leaderboard"
></div>

  </div></div><script>

/* =====================================================
   VOICE SYSTEM
===================================================== */

let voiceEnabled = false;

let voiceQueue = [];

let speaking = false;

let lastSpokenEventId = "";

let availableVoices = [];

let voiceReady = false;


/* =====================================================
   VOICE SUPPORT
===================================================== */

function speechSupported() {

  return (
    "speechSynthesis" in window &&
    "SpeechSynthesisUtterance" in window
  );

}


/* =====================================================
   STATUS
===================================================== */

function setVoiceStatus(text) {

  const status =
    document.getElementById(
      "voiceStatus"
    );

  if (status) {
    status.textContent = text;
  }

}


/* =====================================================
   LOAD VOICES
===================================================== */

function loadVoices() {

  if (!speechSupported()) {

    voiceReady = false;

    setVoiceStatus(
      "Voice is not available in this browser"
    );

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();


  if (
    availableVoices &&
    availableVoices.length
  ) {

    voiceReady = true;

    if (!voiceEnabled) {

      setVoiceStatus(
        "Voice is ready — tap ENABLE VOICE"
      );

    }

  }

}


/* =====================================================
   VOICE CHANGED
===================================================== */

if (speechSupported()) {

  window.speechSynthesis.onvoiceschanged =
    function() {

      loadVoices();

    };

}


/* =====================================================
   INITIAL VOICE LOAD
===================================================== */

loadVoices();


/*
   Android Chrome sometimes returns
   an empty voice list at first.
   Try again several times.
*/

let voiceLoadAttempts = 0;

const voiceLoader =
  setInterval(
    function() {

      loadVoices();

      voiceLoadAttempts++;

      if (
        voiceReady ||
        voiceLoadAttempts > 20
      ) {

        clearInterval(
          voiceLoader
        );

      }

    },
    500
  );


/* =====================================================
   BEST VOICE
===================================================== */

function getBestVoice() {

  if (
    !availableVoices ||
    !availableVoices.length
  ) {

    loadVoices();

  }


  const voices =
    availableVoices || [];


  if (!voices.length) {
    return null;
  }


  /*
     Prefer natural English voices.
  */

  const preferredNames = [

    "Google US English",

    "Google UK English Female",

    "Google UK English Male",

    "Microsoft David",

    "Microsoft Mark",

    "Microsoft Zira",

    "Samantha",

    "Alex"

  ];


  for (
    const preferred
    of preferredNames
  ) {

    const found =
      voices.find(
        voice =>
          voice.name
            .toLowerCase()
            .includes(
              preferred.toLowerCase()
            )
      );

    if (found) {
      return found;
    }

  }


  /*
     Any English voice.
  */

  const english =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("en")
    );


  if (english) {
    return english;
  }


  return voices[0];

}


/* =====================================================
   ENABLE VOICE
===================================================== */

function enableVoice() {

  if (!speechSupported()) {

    setVoiceStatus(
      "❌ This browser does not support speech"
    );

    return;

  }


  voiceEnabled = true;


  const button =
    document.getElementById(
      "voiceButton"
    );


  button.textContent =
    "🔊 VOICE ON";


  button.classList.remove(
    "off"
  );


  setVoiceStatus(
    "🔊 Voice enabled"
  );


  /*
     IMPORTANT:
     Speech is started directly
     from the button click.
     This is required by many
     Android browsers.
  */

  try {

    window.speechSynthesis.cancel();

    loadVoices();


    const unlock =
      new SpeechSynthesisUtterance(
        "Voice enabled"
      );


    unlock.lang = "en-US";

    unlock.rate = 0.9;

    unlock.pitch = 1;

    unlock.volume = 1;


    const voice =
      getBestVoice();


    if (voice) {

      unlock.voice =
        voice;

    }


    unlock.onend =
      function() {

        speaking = false;

        setVoiceStatus(
          "🔊 Voice ON — waiting for comments"
        );

        speakNext();

      };


    unlock.onerror =
      function(error) {

        console.warn(
          "Voice unlock error:",
          error
        );

        speaking = false;

        /*
           Do NOT disable voice.
           Some Android browsers return
           an error on the unlock speech
           even though later speech works.
        */

        setVoiceStatus(
          "🔊 Voice ON — waiting for comments"
        );

        speakNext();

      };


    speaking = true;


    window.speechSynthesis
      .speak(unlock);


  } catch (error) {

    console.error(
      "VOICE ENABLE ERROR:",
      error
    );


    speaking = false;


    setVoiceStatus(
      "🔊 Voice ON — waiting for comments"
    );

  }

}


/* =====================================================
   BUTTON CLICK
===================================================== */

document
  .getElementById(
    "voiceButton"
  )
  .addEventListener(
    "click",
    enableVoice
  );


/* =====================================================
   QUEUE VOICE
===================================================== */

function queueVoice(text) {

  if (!voiceEnabled) {
    return;
  }

  if (!text) {
    return;
  }


  voiceQueue.push(
    String(text)
  );


  /*
     Prevent an unlimited queue
     during very busy live streams.
  */

  if (
    voiceQueue.length >
    30
  ) {

    voiceQueue =
      voiceQueue.slice(-30);

  }


  speakNext();

}


/* =====================================================
   SPEAK NEXT
===================================================== */

function speakNext() {

  if (!voiceEnabled) {
    return;
  }


  if (speaking) {
    return;
  }


  if (!voiceQueue.length) {
    return;
  }


  /*
     Make sure voices have loaded.
  */

  loadVoices();


  const text =
    voiceQueue.shift();


  if (!text) {

    setTimeout(
      speakNext,
      100
    );

    return;

  }


  let utterance;


  try {

    utterance =
      new SpeechSynthesisUtterance(
        text
      );

  } catch (error) {

    console.error(
      "UTTERANCE ERROR:",
      error
    );

    speaking = false;

    setTimeout(
      speakNext,
      300
    );

    return;

  }


  utterance.lang =
    "en-US";

  utterance.rate =
    0.82;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  const voice =
    getBestVoice();


  if (voice) {

    utterance.voice =
      voice;

    utterance.lang =
      voice.lang || "en-US";

  }


  speaking = true;


  utterance.onstart =
    function() {

      setVoiceStatus(
        "🔊 Speaking..."
      );

    };


  utterance.onend =
    function() {

      speaking = false;

      setVoiceStatus(
        "🔊 Voice ON"
      );


      setTimeout(
        speakNext,
        200
      );

    };


  utterance.onerror =
    function(error) {

      console.warn(
        "SPEECH ERROR:",
        error
      );


      speaking = false;


      /*
         Put the message back only
         when appropriate.
      */

      if (
        error &&
        error.error !==
        "canceled"
      ) {

        /*
           If the browser temporarily
           fails, try again.
        */

        voiceQueue.unshift(
          text
        );

      }


      setTimeout(
        speakNext,
        500
      );

    };


  try {

    window.speechSynthesis
      .speak(utterance);

  } catch (error) {

    console.error(
      "SPEAK ERROR:",
      error
    );

    speaking = false;

    voiceQueue.unshift(
      text
    );

    setTimeout(
      speakNext,
      500
    );

  }

}


/* =====================================================
   COUNTRY EVENT VOICE
===================================================== */

function speakEvent(event) {

  if (!voiceEnabled) {
    return;
  }


  if (!event) {
    return;
  }


  if (!event.hasCountry) {
    return;
  }


  if (!event.id) {
    return;
  }


  /*
     Never speak the same event twice.
  */

  if (
    event.id ===
    lastSpokenEventId
  ) {

    return;

  }


  lastSpokenEventId =
    event.id;


  let text = "";


  /* =================================================
     NORMAL COMMENT
  ================================================= */

  if (
    event.type ===
    "comment"
  ) {

    text =
      `${event.displayName}, ` +
      `${event.countryName}, ` +
      `${event.points} point`;

  }


  /* =================================================
     SUPER CHAT
  ================================================= */

  else if (
    event.type ===
    "superchat"
  ) {

    const amount =
      Number(
        event.amount || 0
      );


    let money = "";


    if (amount > 0) {

      const currency =
        event.currency ||
        "USD";


      money =
        `${amount.toFixed(2)} ${currency}`;

    }


    text =
      `${event.displayName}, ` +
      `${event.countryName}, ` +
      `${money}, ` +
      `${event.points} points`;

  }


  if (text) {

    queueVoice(
      text
    );

  }

}


/* =====================================================
   FORMAT POINTS
===================================================== */

function formatPoints(points) {

  return Number(
    points || 0
  ).toLocaleString();

}


/* =====================================================
   TOP 3
===================================================== */

function renderTop3(top3) {

  const container =
    document.getElementById(
      "top3"
    );


  const ranks = [

    "🥇 1ST",

    "🥈 2ND",

    "🥉 3RD"

  ];


  let html = "";


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const country =
      top3 &&
      top3[i];


    if (!country) {

      html += `

        <div class="top-card">

          <div class="rank">
            ${ranks[i]}
          </div>

          <div class="flag">
            🌍
          </div>

          <div class="country-name">
            Waiting...
          </div>

          <div class="points">
            0
          </div>

        </div>

      `;

      continue;

    }


    html += `

      <div
        class="top-card ${
          i === 0
            ? "first"
            : ""
        }"
      >

        <div class="rank">
          ${ranks[i]}
        </div>

        <div class="flag">
          ${country.flag || "🌍"}
        </div>

        <div class="country-name">
          ${escapeHtml(
            country.countryName
          )}
        </div>

        <div class="points">
          ${formatPoints(
            country.score
          )}
        </div>

      </div>

    `;

  }


  container.innerHTML =
    html;

}


/* =====================================================
   LAST EVENT
===================================================== */

function renderEvent(event) {

  const box =
    document.getElementById(
      "eventBox"
    );


  if (
    !event ||
    !event.hasCountry
  ) {

    box.className =
      "event-box";


    box.innerHTML = `

      <div class="event-name">
        Waiting for a country comment...
      </div>

      <div class="event-country">
        🌍
      </div>

      <div class="event-points">
        0 POINTS
      </div>

    `;


    return;

  }


  /* =================================================
     SUPER CHAT
  ================================================= */

  if (
    event.type ===
    "superchat"
  ) {

    box.className =
      "event-box superchat";


    const amount =
      Number(
        event.amount || 0
      );


    const money =
      amount > 0
        ? `${amount.toFixed(2)} ${
            event.currency ||
            "USD"
          }`
        : "";


    box.innerHTML = `

      <div class="event-name">

        💰 ${escapeHtml(
          event.displayName
        )}

      </div>

      <div class="event-country">

        ${event.flag || "🌍"}

        ${escapeHtml(
          event.countryName
        )}

      </div>

      <div class="event-points">

        ${money}

        +

        ${formatPoints(
          event.points
        )}

        POINTS

      </div>

    `;


    return;

  }


  /* =================================================
     NORMAL COMMENT
  ================================================= */

  box.className =
    "event-box";


  box.innerHTML = `

    <div class="event-name">

      ${escapeHtml(
        event.displayName
      )}

    </div>

    <div class="event-country">

      ${event.flag || "🌍"}

      ${escapeHtml(
        event.countryName
      )}

    </div>

    <div class="event-points">

      +

      ${formatPoints(
        event.points
      )}

      POINT

    </div>

  `;

}


/* =====================================================
   LEADERBOARD
===================================================== */

function renderLeaderboard(
  countries
) {

  const container =
    document.getElementById(
      "leaderboard"
    );


  let html = "";


  countries.forEach(
    (country, index) => {

      html += `

        <div class="country-row">

          <div class="country-rank">
            ${index + 1}
          </div>

          <div class="country-flag">
            ${country.flag || "🌍"}
          </div>

          <div class="country-info">

            <div
              class="country-name-small"
            >

              ${escapeHtml(
                country.countryName
              )}

            </div>

            <div
              class="country-player"
            >

              ${
                country.latestCommenter
                  ? "Last: " +
                    escapeHtml(
                      country.latestCommenter
                    )
                  : ""
              }

            </div>

          </div>

          <div class="country-score">

            ${formatPoints(
