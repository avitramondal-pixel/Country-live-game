<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Country Battle Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;min-height:100%;
  background:#05060c;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{overflow-x:hidden;}
.app{
  width:100%;max-width:820px;min-height:100vh;margin:auto;
  background:radial-gradient(circle at 50% 5%,rgba(70,50,160,.35),transparent 40%),
             linear-gradient(180deg,#07080f 0%,#0d1030 45%,#07080f 100%);
  padding-bottom:90px;
}
.header{text-align:center;padding:22px 12px 4px;}
.title{
  font-size:clamp(26px,7vw,50px);font-weight:1000;letter-spacing:2px;
  color:#ffe75b;
  text-shadow:0 0 6px rgba(255,230,70,.85),0 0 22px rgba(255,200,0,.4);
}
.rules{
  margin:12px 20px 16px;padding:9px 12px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  border:1.5px solid rgba(255,225,72,.55);border-radius:11px;
  background:rgba(0,0,0,.55);
}
.rule{font-size:clamp(10px,2.6vw,15px);font-weight:900;white-space:nowrap;}
.yellow{color:#ffe13b;}

.section-title{
  text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;
  color:#8a8fb0;margin:14px 0 8px;
}

/* TOP 3 PLAYERS */
.top-players-wrap{padding:0 12px;}
.top-players{
  display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;
}
.player-card{
  position:relative;text-align:center;padding:10px 6px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(40,42,68,.96),rgba(8,9,18,.98));
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 8px 22px rgba(0,0,0,.55);
  min-width:0;
}
.player-card.rank-1{
  border-color:#ffd92e;
  box-shadow:0 0 22px rgba(255,211,36,.5),0 8px 22px rgba(0,0,0,.55);
  transform:translateY(-6px);
}
.player-card.rank-2{border-color:#d5d8e3;}
.player-card.rank-3{border-color:#c48246;}
.p-crown{font-size:22px;height:24px;line-height:24px;}
.p-rank-badge{
  position:absolute;top:6px;right:6px;width:22px;height:22px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:1000;border:2px solid #fff;color:#fff;
}
.rank-1 .p-rank-badge{background:#ed2633;}
.rank-2 .p-rank-badge{background:#9aa0b4;}
.rank-3 .p-rank-badge{background:#b06a30;}
.p-avatar-wrap{
  width:62px;height:62px;margin:4px auto 6px;border-radius:50%;
  padding:3px;background:linear-gradient(180deg,#2a2c44,#0e0f1c);
  border:2px solid rgba(255,255,255,.5);
  overflow:hidden;position:relative;
}
.rank-1 .p-avatar-wrap{
  border-color:#ffe338;box-shadow:0 0 16px rgba(255,220,50,.65);
  width:68px;height:68px;
}
.rank-2 .p-avatar-wrap{border-color:#d5d8e3;}
.rank-3 .p-avatar-wrap{border-color:#c48246;}
.p-avatar{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  background:#171927;display:block;
}
.p-avatar-fallback{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;background:#171927;color:#4a4d66;
}
.p-name{
  margin-top:2px;font-size:11px;font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.p-amount{
  margin-top:3px;color:#ffe02f;font-size:15px;font-weight:1000;
}
.p-country{
  margin-top:5px;font-size:10px;color:#d6d8e2;
  display:flex;align-items:center;justify-content:center;gap:4px;
  white-space:nowrap;overflow:hidden;
}
.p-country .flag-mini{font-size:14px;}

/* TOP 3 COUNTRIES */
.top-countries-wrap{padding:0 12px;}
.top-countries{
  display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;
}
.tc-card{
  position:relative;text-align:center;padding:8px 4px 10px;border-radius:10px;
  background:linear-gradient(180deg,rgba(30,32,54,.95),rgba(8,9,18,.95));
  border:2px solid rgba(255,255,255,.12);
}
.tc-card.rank-1{
  border-color:#ffd92e;
  box-shadow:0 0 18px rgba(255,211,36,.55);
  transform:translateY(-6px);
}
.tc-card.rank-2{border-color:#d5d8e3;}
.tc-card.rank-3{border-color:#c48246;}
.tc-crown{font-size:16px;height:18px;line-height:18px;}
.tc-rank-badge{
  position:absolute;top:4px;left:4px;padding:2px 6px;border-radius:6px;
  font-size:9px;font-weight:1000;background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.25);
}
.rank-1 .tc-rank-badge{background:#ffd92e;color:#111;border-color:#fff5b0;}
.tc-flag-box{
  width:52px;height:38px;margin:4px auto 5px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;background:#10121f;
  border:2px solid rgba(255,255,255,.18);overflow:hidden;
}
.rank-1 .tc-flag-box{border-color:#ffe338;box-shadow:0 0 10px rgba(255,220,50,.5);}
.tc-points{font-size:14px;font-weight:1000;color:#ffe02f;}

/* EVENT */
.event-area{
  margin:14px 12px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  padding:8px 10px;border-radius:9px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);
}
.event{width:100%;text-align:center;font-size:12.5px;font-weight:900;line-height:1.4;}
.event.superchat{color:#ffe02c;}
.event .name{color:#6ee7ff;}
.event .country{color:#ffe13b;}
.event .points{color:#a8ff8a;}
.event .avatar-mini{
  width:20px;height:20px;border-radius:50%;vertical-align:middle;
  margin-right:5px;border:1.5px solid rgba(255,255,255,.4);
  object-fit:cover;
}

/* COUNTRY GRID */
.grid-section{padding:4px 12px 20px;}
.country-grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:5px;
}
.cell{
  position:relative;border-radius:8px;padding:4px 2px 6px;text-align:center;
  background:linear-gradient(180deg,rgba(26,28,48,.95),rgba(8,9,18,.95));
  border:1.5px solid rgba(255,255,255,.08);min-width:0;
}
.cell.rank-1{border-color:#ffd92e;box-shadow:0 0 12px rgba(255,211,36,.55);}
.cell.rank-2{border-color:#d5d8e3;}
.cell.rank-3{border-color:#c48246;}
.cell-rank{
  position:absolute;top:2px;left:3px;font-size:7.5px;
  font-weight:1000;color:#a4a8c0;
}
.cell.rank-1 .cell-rank,
.cell.rank-2 .cell-rank,
.cell.rank-3 .cell-rank{color:#ffe13b;}
.cell-flag{font-size:22px;line-height:1;margin-top:8px;display:block;}
.cell-points{margin-top:3px;font-size:10px;font-weight:1000;color:#e6e8f2;}
.cell.rank-1 .cell-points,
.cell.rank-2 .cell-points,
.cell.rank-3 .cell-points{color:#ffe02f;}

/* CONTROLS */
.controls{
  position:fixed;right:12px;bottom:12px;z-index:999;
  display:flex;flex-direction:column;gap:7px;
}
.control{
  border:none;padding:9px 13px;border-radius:22px;
  background:#202337;color:#fff;border:1px solid rgba(255,255,255,.15);
  font-size:10px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
}
.control.on{background:#147b4d;}
.connection{
  position:fixed;left:12px;bottom:12px;z-index:999;
  padding:8px 12px;border-radius:20px;background:#202337;
  border:1px solid rgba(255,255,255,.15);
  font-size:9px;font-weight:900;
}
.connection.connected{background:#147b4d;}
.connection.error{background:#8b2020;}

@media(max-width:400px){
  .country-grid{grid-template-columns:repeat(7,1fr);}
  .cell-flag{font-size:19px;}
  .cell-points{font-size:9px;}
  .p-avatar-wrap{width:54px;height:54px;}
  .rank-1 .p-avatar-wrap{width:60px;height:60px;}
  .tc-flag-box{width:44px;height:32px;font-size:22px;}
}
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="title">TYPE YOUR COUNTRY</div>
  </div>

  <div class="rules">
    <div class="rule">💬 1 COMMENT = <span class="yellow">1 POINT</span></div>
    <div class="rule">💎 $1 SUPERCHAT = <span class="yellow">1000 POINTS</span></div>
  </div>

  <div class="section-title">🏆 TOP 3 PLAYERS</div>
  <div class="top-players-wrap">
    <div class="top-players" id="topPlayers"></div>
  </div>

  <div class="section-title">🏆 TOP 3 COUNTRIES</div>
  <div class="top-countries-wrap">
    <div class="top-countries" id="topCountries"></div>
  </div>

  <div class="event-area">
    <div id="event" class="event">Waiting for comments...</div>
  </div>

  <div class="grid-section">
    <div id="countryGrid" class="country-grid"></div>
  </div>

</div>

<div class="controls">
  <button id="musicButton" class="control">🎵 MUSIC OFF</button>
  <button id="voiceButton" class="control on">🔊 VOICE ON</button>
</div>

<div id="connection" class="connection">🔄 CONNECTING...</div>

<audio id="backgroundMusic" src="/music/background.mp3" loop preload="auto"></audio>

<script>
(function(){
"use strict";

/* ============ COUNTRY LIST (195) ============ */

var COUNTRY_DATA = [
  ["AF","Afghanistan"],["AL","Albania"],["DZ","Algeria"],["AD","Andorra"],
  ["AO","Angola"],["AG","Antigua and Barbuda"],["AR","Argentina"],
  ["AM","Armenia"],["AU","Australia"],["AT","Austria"],["AZ","Azerbaijan"],
  ["BS","Bahamas"],["BH","Bahrain"],["BD","Bangladesh"],["BB","Barbados"],
  ["BY","Belarus"],["BE","Belgium"],["BZ","Belize"],["BJ","Benin"],
  ["BT","Bhutan"],["BO","Bolivia"],["BA","Bosnia and Herzegovina"],
  ["BW","Botswana"],["BR","Brazil"],["BN","Brunei"],["BG","Bulgaria"],
  ["BF","Burkina Faso"],["BI","Burundi"],
  ["CV","Cape Verde"],["KH","Cambodia"],["CM","Cameroon"],["CA","Canada"],
  ["CF","Central African Republic"],["TD","Chad"],["CL","Chile"],["CN","China"],
  ["CO","Colombia"],["KM","Comoros"],["CG","Congo"],
  ["CD","Democratic Republic of the Congo"],["CR","Costa Rica"],
  ["CI","Cote d'Ivoire"],["HR","Croatia"],["CU","Cuba"],["CY","Cyprus"],
  ["CZ","Czechia"],
  ["DK","Denmark"],["DJ","Djibouti"],["DM","Dominica"],["DO","Dominican Republic"],
  ["EC","Ecuador"],["EG","Egypt"],["SV","El Salvador"],["GQ","Equatorial Guinea"],
  ["ER","Eritrea"],["EE","Estonia"],["SZ","Eswatini"],["ET","Ethiopia"],
  ["FJ","Fiji"],["FI","Finland"],["FR","France"],
  ["GA","Gabon"],["GM","Gambia"],["GE","Georgia"],["DE","Germany"],["GH","Ghana"],
  ["GR","Greece"],["GD","Grenada"],["GT","Guatemala"],["GN","Guinea"],
  ["GW","Guinea-Bissau"],["GY","Guyana"],
  ["HT","Haiti"],["HN","Honduras"],["HU","Hungary"],
  ["IS","Iceland"],["IN","India"],["ID","Indonesia"],["IR","Iran"],["IQ","Iraq"],
  ["IE","Ireland"],["IL","Israel"],["IT","Italy"],
  ["JM","Jamaica"],["JP","Japan"],["JO","Jordan"],
  ["KZ","Kazakhstan"],["KE","Kenya"],["KI","Kiribati"],["KW","Kuwait"],
  ["KG","Kyrgyzstan"],
  ["LA","Laos"],["LV","Latvia"],["LB","Lebanon"],["LS","Lesotho"],["LR","Liberia"],
  ["LY","Libya"],["LI","Liechtenstein"],["LT","Lithuania"],["LU","Luxembourg"],
  ["MG","Madagascar"],["MW","Malawi"],["MY","Malaysia"],["MV","Maldives"],
  ["ML","Mali"],["MT","Malta"],["MH","Marshall Islands"],["MR","Mauritania"],
  ["MU","Mauritius"],["MX","Mexico"],["FM","Micronesia"],["MD","Moldova"],
  ["MC","Monaco"],["MN","Mongolia"],["ME","Montenegro"],["MA","Morocco"],
  ["MZ","Mozambique"],["MM","Myanmar"],
  ["NA","Namibia"],["NR","Nauru"],["NP","Nepal"],["NL","Netherlands"],
  ["NZ","New Zealand"],["NI","Nicaragua"],["NE","Niger"],["NG","Nigeria"],
  ["KP","North Korea"],["MK","North Macedonia"],["NO","Norway"],
  ["OM","Oman"],
  ["PK","Pakistan"],["PW","Palau"],["PS","Palestine"],["PA","Panama"],
  ["PG","Papua New Guinea"],["PY","Paraguay"],["PE","Peru"],["PH","Philippines"],
  ["PL","Poland"],["PT","Portugal"],
  ["QA","Qatar"],
  ["RO","Romania"],["RU","Russia"],["RW","Rwanda"],
  ["KN","Saint Kitts and Nevis"],["LC","Saint Lucia"],
  ["VC","Saint Vincent and the Grenadines"],["WS","Samoa"],["SM","San Marino"],
  ["ST","Sao Tome and Principe"],["SA","Saudi Arabia"],["SN","Senegal"],
  ["RS","Serbia"],["SC","Seychelles"],["SL","Sierra Leone"],["SG","Singapore"],
  ["SK","Slovakia"],["SI","Slovenia"],["SB","Solomon Islands"],["SO","Somalia"],
  ["ZA","South Africa"],["KR","South Korea"],["SS","South Sudan"],["ES","Spain"],
  ["LK","Sri Lanka"],["SD","Sudan"],["SR","Suriname"],["SE","Sweden"],
  ["CH","Switzerland"],["SY","Syria"],
  ["TJ","Tajikistan"],["TZ","Tanzania"],["TH","Thailand"],["TL","Timor-Leste"],
  ["TG","Togo"],["TO","Tonga"],["TT","Trinidad and Tobago"],["TN","Tunisia"],
  ["TR","Türkiye"],["TM","Turkmenistan"],["TV","Tuvalu"],
  ["UG","Uganda"],["UA","Ukraine"],["AE","United Arab Emirates"],
  ["GB","United Kingdom"],["US","United States"],["UY","Uruguay"],
  ["UZ","Uzbekistan"],
  ["VU","Vanuatu"],["VA","Holy See"],["VE","Venezuela"],["VN","Vietnam"],
  ["YE","Yemen"],
  ["ZM","Zambia"],["ZW","Zimbabwe"]
];

function codeToFlag(code){
  return code.toUpperCase().split("").map(function(c){
    return String.fromCodePoint(127397 + c.charCodeAt(0));
  }).join("");
}

var masterCountries = [];
for(var i = 0; i < COUNTRY_DATA.length; i++){
  masterCountries.push({
    country: COUNTRY_DATA[i][1].replace(/[^a-zA-Z0-9]+/g,""),
    countryName: COUNTRY_DATA[i][1],
    flag: codeToFlag(COUNTRY_DATA[i][0]),
    score: 0, commentCount: 0, superChats: 0, latestCommenter: ""
  });
}

/* ============ ELEMENTS ============ */

var music          = document.getElementById("backgroundMusic");
var musicButton    = document.getElementById("musicButton");
var voiceButton    = document.getElementById("voiceButton");
var eventElement   = document.getElementById("event");
var topPlayersEl   = document.getElementById("topPlayers");
var topCountriesEl = document.getElementById("topCountries");
var countryGrid    = document.getElementById("countryGrid");
var connectionEl   = document.getElementById("connection");

var musicEnabled = false;
var voiceEnabled = true;
var lastEventId = "";
var firstStateLoaded = false;
var loading = false;
var currentCountries = masterCountries.slice();

/* ============ HELPERS ============ */

function escapeHtml(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatNumber(v){ return Number(v || 0).toLocaleString("en-US"); }
function formatUSD(v){ return "$" + Number(v || 0).toFixed(2); }
function getCountryName(c){ if(!c) return "Unknown"; return c.countryName || "Unknown"; }
function getFlag(c){ if(!c) return "🌍"; return c.flag || "🌍"; }

/* ============ CONNECTION ============ */

function setConnectionStatus(ok){
  if(ok){
    connectionEl.textContent = "🟢 YOUTUBE CONNECTED";
    connectionEl.classList.add("connected");
    connectionEl.classList.remove("error");
  }else{
    connectionEl.textContent = "🔴 YOUTUBE DISCONNECTED";
    connectionEl.classList.remove("connected");
    connectionEl.classList.add("error");
  }
}

/* ============ MUSIC ============ */

function startMusic(){
  try{
    music.volume = 0.12;
    var p = music.play();
    if(p && p.then){
      p.then(function(){
        musicEnabled = true;
        musicButton.textContent = "🎵 MUSIC ON";
        musicButton.classList.add("on");
      }).catch(function(){
        musicEnabled = false;
        musicButton.textContent = "🎵 MUSIC OFF";
        musicButton.classList.remove("on");
      });
    }
  }catch(e){ musicEnabled = false; }
}

window.addEventListener("load", function(){ setTimeout(startMusic, 500); });

musicButton.addEventListener("click", function(){
  if(music.paused || !musicEnabled){ startMusic(); }
  else{
    music.pause(); musicEnabled = false;
    musicButton.textContent = "🎵 MUSIC OFF";
    musicButton.classList.remove("on");
  }
});

/* ============ VOICE ============ */

voiceButton.addEventListener("click", function(){
  voiceEnabled = !voiceEnabled;
  if(!voiceEnabled){
    if("speechSynthesis" in window) speechSynthesis.cancel();
    voiceButton.textContent = "🔇 VOICE OFF";
    voiceButton.classList.remove("on");
  }else{
    voiceButton.textContent = "🔊 VOICE ON";
    voiceButton.classList.add("on");
  }
});

function speak(text){
  if(!voiceEnabled) return;
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    if(musicEnabled && !music.paused) music.volume = 0.035;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.95; u.pitch = 1; u.volume = 1;
    u.onend = u.onerror = function(){
      if(musicEnabled && !music.paused) music.volume = 0.12;
    };
    speechSynthesis.speak(u);
  }catch(e){ console.error("VOICE ERROR:", e); }
}

/* ============ ANNOUNCE ============ */

function announceEvent(event){
  if(!event || !event.id) return;
  if(!firstStateLoaded){ lastEventId = event.id; return; }
  if(event.id === lastEventId) return;
  lastEventId = event.id;

  var name = event.displayName || "Someone";
  var country = event.countryName || "";
  var points = Number(event.points || 0);

  if(event.type === "superchat"){
    var amount = Number(event.amountMicros || 0) / 1000000;
    var currency = event.currency || "USD";
    speak("Super Chat from " + name + ". " + country + ". " +
          amount.toFixed(2) + " " + currency + ". " +
          formatNumber(points) + " points.");
    return;
  }
  if(event.type === "comment"){
    if(points > 0) speak(name + ". " + country + ". " + formatNumber(points) + " point.");
    else speak(name + " commented.");
  }
}

/* ============ RENDER EVENT ============ */

function renderEvent(event){
  if(!event || !event.id){
    eventElement.className = "event";
    eventElement.textContent = "Waiting for comments...";
    return;
  }
  var name = event.displayName || "Someone";
  var country = event.countryName || "";
  var points = Number(event.points || 0);
  var avatar = event.profileImageUrl || "";
  var avatarHTML = avatar ? '<img class="avatar-mini" src="' + escapeHtml(avatar) + '" alt="">' : "";

  if(event.type === "superchat"){
    var amount = Number(event.amountMicros || 0) / 1000000;
    var currency = event.currency || "USD";
    eventElement.className = "event superchat";
    eventElement.innerHTML = '💎 ' + avatarHTML +
      '<span class="name">' + escapeHtml(name) + '</span> sent ' +
      '<strong>' + amount.toFixed(2) + ' ' + escapeHtml(currency) + '</strong>' +
      ' · <span class="points">' + formatNumber(points) + ' POINTS</span>' +
      (country ? ' · <span class="country">' + escapeHtml(country) + '</span>' : '');
    return;
  }
  eventElement.className = "event comment";
  if(points > 0){
    eventElement.innerHTML = '💬 ' + avatarHTML +
      '<span class="name">' + escapeHtml(name) + '</span>' +
      (country ? ' · <span class="country">' + escapeHtml(country) + '</span>' : '') +
      ' · <span class="points">+' + formatNumber(points) + ' POINT</span>';
  }else{
    eventElement.innerHTML = '💬 ' + avatarHTML +
      '<span class="name">' + escapeHtml(name) + '</span> commented';
  }
}

/* ============ TOP 3 PLAYERS ============ */

function renderTopPlayers(players){
  var list = (players && players.length) ? players.slice() : [];
  var sorted = list.filter(function(p){
    if(!p) return false;
    return Number(p.amount || 0) > 0 || Number(p.score || 0) > 0;
  }).sort(function(a,b){
    var da = Number(a.amount || 0), db = Number(b.amount || 0);
    if(db !== da) return db - da;
    return Number(b.score || 0) - Number(a.score || 0);
  }).slice(0,3);

  var positions = [1,0,2];
  var classes   = ["rank-2","rank-1","rank-3"];
  var crowns    = ["♛","👑","♛"];
  var rankNums  = [2,1,3];
  var html = "";

  for(var slot = 0; slot < 3; slot++){
    var p = sorted[positions[slot]];
    var cls = classes[slot], crn = crowns[slot], rn = rankNums[slot];

    if(!p){
      html += '<div class="player-card ' + cls + '">' +
        '<div class="p-rank-badge">' + rn + '</div>' +
        '<div class="p-crown">' + crn + '</div>' +
        '<div class="p-avatar-wrap"><div class="p-avatar-fallback">👤</div></div>' +
        '<div class="p-name">Waiting...</div>' +
        '<div class="p-amount">$0.00</div>' +
        '<div class="p-country">— — —</div></div>';
      continue;
    }

    var avatar = p.profileImageUrl || "";
    var avatarHTML = avatar
      ? '<img class="p-avatar" src="' + escapeHtml(avatar) + '" alt="">'
      : '<div class="p-avatar-fallback">👤</div>';

    html += '<div class="player-card ' + cls + '">' +
      '<div class="p-rank-badge">' + rn + '</div>' +
      '<div class="p-crown">' + crn + '</div>' +
      '<div class="p-avatar-wrap">' + avatarHTML + '</div>' +
      '<div class="p-name">' + escapeHtml(p.displayName || "Player") + '</div>' +
      '<div class="p-amount">' + formatUSD(p.amount || 0) + '</div>' +
      '<div class="p-country">' +
        '<span class="flag-mini">' + escapeHtml(getFlag(p)) + '</span>' +
        '<span>' + escapeHtml(getCountryName(p)) + '</span>' +
      '</div></div>';
  }
  topPlayersEl.innerHTML = html;
}

/* ============ TOP 3 COUNTRIES ============ */

function renderTopCountries(countries){
  var list = (countries && countries.length) ? countries.slice() : [];
  var sorted = list.map(function(c){
    return { countryName: c.countryName, flag: c.flag, score: Number(c.score || 0) };
  }).filter(function(c){ return c.score > 0; })
    .sort(function(a,b){ return b.score - a.score; })
    .slice(0,3);

  var positions = [1,0,2];
  var classes   = ["rank-2","rank-1","rank-3"];
  var crowns    = ["♛","👑","♛"];
  var rankNums  = [2,1,3];
  var html = "";

  for(var slot = 0; slot < 3; slot++){
    var c = sorted[positions[slot]];
    var cls = classes[slot], crn = crowns[slot], rn = rankNums[slot];

    if(!c){
      html += '<div class="tc-card ' + cls + '">' +
        '<div class="tc-rank-badge">#' + rn + '</div>' +
        '<div class="tc-crown">' + crn + '</div>' +
        '<div class="tc-flag-box">🏳️</div>' +
        '<div class="tc-points">0</div></div>';
      continue;
    }
    html += '<div class="tc-card ' + cls + '">' +
      '<div class="tc-rank-badge">#' + rn + '</div>' +
      '<div class="tc-crown">' + crn + '</div>' +
      '<div class="tc-flag-box">' + escapeHtml(getFlag(c)) + '</div>' +
      '<div class="tc-points">' + formatNumber(c.score) + '</div></div>';
  }
  topCountriesEl.innerHTML = html;
}

/* ============ COUNTRY GRID ============ */

function renderCountryGrid(countries){
  var list = (countries && countries.length) ? countries.slice() : currentCountries.slice();
  var sorted = list.map(function(c){
    return { countryName: c.countryName, flag: c.flag, score: Number(c.score || 0) };
  }).sort(function(a,b){
    if(b.score !== a.score) return b.score - a.score;
    return String(a.countryName).localeCompare(String(b.countryName));
  });

  var html = "";
  for(var i = 0; i < sorted.length; i++){
    var rank = i + 1;
    var rankCls = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
    html += '<div class="cell ' + rankCls + '">' +
      '<div class="cell-rank">#' + rank + '</div>' +
      '<div class="cell-flag">' + escapeHtml(sorted[i].flag) + '</div>' +
      '<div class="cell-points">' + formatNumber(sorted[i].score) + '</div></div>';
  }
  countryGrid.innerHTML = html;
}

/* ============ INITIAL PRE-RENDER ============ */

try { renderTopPlayers([]); } catch(e){}
try { renderTopCountries([]); } catch(e){}
try { renderCountryGrid([]); } catch(e){}
try { renderEvent(null); } catch(e){}

/* ============ FETCH STATE ============ */

function fetchState(){
  if(loading) return;
  loading = true;

  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/api/state?t=" + Date.now(), true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState !== 4) return;
    loading = false;

    if(xhr.status < 200 || xhr.status >= 300){
      setConnectionStatus(false);
      return;
    }
    try{
      var data = JSON.parse(xhr.responseText);
      setConnectionStatus(data.connected !== false);

      var serverCountries = (data.countries && data.countries.length) ? data.countries : [];
      var serverMap = {};
      for(var i = 0; i < serverCountries.length; i++){
        var sc = serverCountries[i];
        var key = String(sc.country || sc.countryName || "").replace(/[^a-zA-Z0-9]+/g,"");
        serverMap[key] = sc;
      }
      currentCountries = masterCountries.map(function(mc){
        var s = serverMap[mc.country];
        return {
          country: mc.country,
          countryName: mc.countryName,
          flag: mc.flag,
          score: s ? Number(s.score || 0) : 0,
          commentCount: s ? Number(s.commentCount || 0) : 0,
          superChats: s ? Number(s.superChats || 0) : 0
        };
      });

      var playersList = (data.players && data.players.length) ? data.players : [];

      renderTopPlayers(playersList);
      renderTopCountries(currentCountries);
      renderCountryGrid(currentCountries);

      var evt = data.lastEvent || null;
      if(evt){
        renderEvent(evt);
        announceEvent(evt);
      }
      firstStateLoaded = true;
    }catch(e){
      console.error("FETCH PARSE ERROR:", e);
      setConnectionStatus(false);
    }
  };
  xhr.send();
}

setInterval(fetchState, 2000);
fetchState();

})();
</script>
