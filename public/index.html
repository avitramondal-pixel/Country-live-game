<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Country Battle Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;min-height:100%;
  background:#05060c;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body{overflow-x:hidden;}
.app{
  width:100%;max-width:820px;min-height:100vh;margin:auto;
  background:radial-gradient(circle at 50% 5%,rgba(70,50,160,.35),transparent 40%),
             linear-gradient(180deg,#07080f 0%,#0d1030 45%,#07080f 100%);
  padding-bottom:90px;
  padding-top:20px;
}
.header{text-align:center;padding:12px 12px 4px;}
.title{
  font-size:clamp(26px,7vw,50px);font-weight:1000;letter-spacing:2px;
  color:#ffe75b;
  text-shadow:0 0 6px rgba(255,230,70,.85),0 0 22px rgba(255,200,0,.4);
}
.rules{
  margin:12px 20px 20px;padding:9px 12px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  border:1.5px solid rgba(255,225,72,.55);border-radius:11px;
  background:rgba(0,0,0,.55);
}
.rule{font-size:clamp(10px,2.6vw,15px);font-weight:900;white-space:nowrap;}
.yellow{color:#ffe13b;}

.section-title{
  text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;
  color:#8a8fb0;margin:20px 0 32px;
}

/* ================= TOP 3 PLAYERS ================= */

.top-players-wrap{padding:0 8px;}
.top-players{
  display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:4px;align-items:end;
}

.player-card{
  position:relative;text-align:center;
  padding:34px 6px 40px;
  border-radius:12px;
  background:linear-gradient(180deg,rgba(20,22,40,.98),rgba(6,7,15,.98));
  border:3px solid;
  min-width:0;
  transition:transform .3s;
}

.player-card.rank-1{
  border-color:#ffd32e;
  background:
    linear-gradient(180deg,rgba(60,45,10,.65),rgba(20,14,4,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 30px rgba(255,200,20,.7),
    0 0 60px rgba(255,150,0,.3),
    0 8px 24px rgba(0,0,0,.6),
    inset 0 0 25px rgba(255,200,20,.18);
  transform:translateY(-10px) scale(1.02);
}

.player-card.rank-2{
  border-color:#d8dbe6;
  background:
    linear-gradient(180deg,rgba(50,55,80,.55),rgba(14,16,28,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 22px rgba(220,225,240,.55),
    0 0 45px rgba(150,170,255,.25),
    0 8px 24px rgba(0,0,0,.6),
    inset 0 0 20px rgba(200,215,255,.12);
}

.player-card.rank-3{
  border-color:#d08a4a;
  background:
    linear-gradient(180deg,rgba(60,32,10,.55),rgba(20,10,4,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 22px rgba(210,130,60,.55),
    0 0 45px rgba(255,120,20,.22),
    0 8px 24px rgba(0,0,0,.6),
    inset 0 0 20px rgba(255,150,60,.12);
}

.p-crown{
  position:absolute;
  top:-26px;
  left:50%;
  transform:translateX(-50%);
  font-size:36px;
  line-height:1;
  filter:drop-shadow(0 0 10px rgba(255,220,60,.85));
  z-index:3;
}
.rank-2 .p-crown{
  filter:drop-shadow(0 0 10px rgba(200,220,255,.85));
  font-size:30px;
  top:-22px;
}
.rank-3 .p-crown{
  filter:drop-shadow(0 0 10px rgba(255,160,80,.85));
  font-size:28px;
  top:-20px;
}

.p-rank-badge{
  position:absolute;
  top:8px;
  right:8px;
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:1000;
  border:2px solid #fff;
  color:#fff;
  z-index:4;
}
.rank-1 .p-rank-badge{
  background:linear-gradient(180deg,#ffd93a,#b47d00);
  color:#2a1a00;
  border-color:#fff5b0;
  box-shadow:0 0 10px rgba(255,200,20,.8);
}
.rank-2 .p-rank-badge{
  background:linear-gradient(180deg,#e8eaf2,#8a8fa5);
  color:#111;
  box-shadow:0 0 8px rgba(200,220,255,.6);
}
.rank-3 .p-rank-badge{
  background:linear-gradient(180deg,#e29a54,#8a4d15);
  color:#fff;
  box-shadow:0 0 8px rgba(255,150,60,.6);
}

.p-avatar-wrap{
  width:78px;
  height:78px;
  margin:6px auto 8px;
  border-radius:50%;
  padding:4px;
  background:radial-gradient(circle at 50% 30%, #3a3d5a, #0a0b18);
  border:3px solid;
  overflow:hidden;
  position:relative;
}
.rank-1 .p-avatar-wrap{
  border-color:#ffd93a;
  box-shadow:
    0 0 18px rgba(255,210,40,.85),
    0 0 32px rgba(255,180,0,.45),
    inset 0 0 8px rgba(255,210,40,.4);
  width:86px;
  height:86px;
}
.rank-2 .p-avatar-wrap{
  border-color:#dfe2ec;
  box-shadow:
    0 0 14px rgba(220,230,255,.7),
    inset 0 0 6px rgba(200,220,255,.35);
}
.rank-3 .p-avatar-wrap{
  border-color:#dd9655;
  box-shadow:
    0 0 14px rgba(255,150,70,.7),
    inset 0 0 6px rgba(255,150,70,.35);
}

.p-avatar{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  background:#171927;display:block;
}
.p-avatar-fallback{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;
  background:linear-gradient(180deg,#1e2038,#0a0b18);
  color:#4a4d66;
}

.p-name{
  margin-top:6px;
  font-size:11.5px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.3px;
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.p-amount{
  margin-top:4px;
  font-size:16px;
  font-weight:1000;
  letter-spacing:.3px;
}
.rank-1 .p-amount{
  color:#ffe23a;
  text-shadow:0 0 10px rgba(255,210,40,.85),0 0 20px rgba(255,180,0,.4);
}
.rank-2 .p-amount{
  color:#e6ecff;
  text-shadow:0 0 10px rgba(200,220,255,.7);
}
.rank-3 .p-amount{
  color:#ffb877;
  text-shadow:0 0 10px rgba(255,150,70,.7);
}

.p-country{
  margin-top:6px;
  font-size:9.5px;
  color:#d6d8e2;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  overflow:hidden;
  padding:3px 6px;
  border-radius:10px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.12);
  margin-left:auto;
  margin-right:auto;
  max-width:90%;
}
.p-country .flag-mini{font-size:13px;}


/* ================= TOP 3 COUNTRIES ================= */

.top-countries-wrap{padding:0 8px;}
.top-countries{
  display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:4px;align-items:end;
}

.tc-card{
  position:relative;text-align:center;
  padding:28px 6px 32px;
  border-radius:10px;
  background:linear-gradient(180deg,rgba(20,22,40,.98),rgba(6,7,15,.98));
  border:3px solid;
  min-width:0;
}

.tc-card.rank-1{
  border-color:#ffd32e;
  background:
    linear-gradient(180deg,rgba(60,45,10,.6),rgba(20,14,4,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 26px rgba(255,200,20,.65),
    0 0 50px rgba(255,150,0,.28),
    inset 0 0 20px rgba(255,200,20,.18);
  transform:translateY(-8px);
}
.tc-card.rank-2{
  border-color:#d8dbe6;
  background:
    linear-gradient(180deg,rgba(50,55,80,.5),rgba(14,16,28,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 20px rgba(220,225,240,.5),
    inset 0 0 15px rgba(200,215,255,.12);
}
.tc-card.rank-3{
  border-color:#d08a4a;
  background:
    linear-gradient(180deg,rgba(60,32,10,.5),rgba(20,10,4,.98)),
    linear-gradient(180deg,rgba(20,22,40,.9),rgba(6,7,15,.98));
  box-shadow:
    0 0 20px rgba(210,130,60,.5),
    inset 0 0 15px rgba(255,150,60,.12);
}

.tc-crown{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  line-height:1;
  filter:drop-shadow(0 0 8px rgba(255,220,60,.85));
  z-index:3;
}
.rank-2 .tc-crown{
  font-size:26px;
  top:-19px;
  filter:drop-shadow(0 0 8px rgba(200,220,255,.85));
}
.rank-3 .tc-crown{
  font-size:24px;
  top:-17px;
  filter:drop-shadow(0 0 8px rgba(255,160,80,.85));
}

.tc-rank-badge{
  position:absolute;
  top:6px;
  left:6px;
  padding:2px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:1000;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
}
.rank-1 .tc-rank-badge{
  background:linear-gradient(180deg,#ffd93a,#b47d00);
  color:#2a1a00;
  border-color:#fff5b0;
  box-shadow:0 0 8px rgba(255,200,20,.8);
}
.rank-2 .tc-rank-badge{
  background:linear-gradient(180deg,#e8eaf2,#8a8fa5);
  color:#111;
}
.rank-3 .tc-rank-badge{
  background:linear-gradient(180deg,#e29a54,#8a4d15);
  color:#fff;
}

.tc-flag-box{
  width:64px;
  height:46px;
  margin:6px auto 8px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:radial-gradient(circle at 50% 30%, #232642, #05060e);
  border:2px solid;
  overflow:hidden;
}
.rank-1 .tc-flag-box{
  border-color:#ffd93a;
  box-shadow:
    0 0 14px rgba(255,210,40,.85),
    inset 0 0 8px rgba(255,210,40,.35);
}
.rank-2 .tc-flag-box{
  border-color:#dfe2ec;
  box-shadow:0 0 12px rgba(220,230,255,.65);
}
.rank-3 .tc-flag-box{
  border-color:#dd9655;
  box-shadow:0 0 12px rgba(255,150,70,.65);
}

.tc-points{
  font-size:16px;
  font-weight:1000;
  letter-spacing:.5px;
  padding:3px 8px;
  border-radius:8px;
  display:inline-block;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12);
}
.rank-1 .tc-points{
  color:#ffe23a;
  text-shadow:0 0 10px rgba(255,210,40,.8);
  border-color:rgba(255,200,40,.4);
}
.rank-2 .tc-points{
  color:#e6ecff;
  text-shadow:0 0 8px rgba(200,220,255,.6);
}
.rank-3 .tc-points{
  color:#ffb877;
  text-shadow:0 0 8px rgba(255,150,70,.6);
}


/* ================= EVENT TICKER ================= */

.event-area{
  margin:24px 12px 14px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  padding:8px 10px;border-radius:9px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);
}
.event{width:100%;text-align:center;font-size:12.5px;font-weight:900;line-height:1.4;}
.event.superchat{color:#ffe02c;}
.event .name{color:#6ee7ff;}
.event .country{color:#ffe13b;}
.event .points{color:#a8ff8a;}
.event .avatar-mini{
  width:20px;height:20px;border-radius:50%;vertical-align:middle;
  margin-right:5px;border:1.5px solid rgba(255,255,255,.4);
  object-fit:cover;
}


/* ================= COUNTRY GRID ================= */

.grid-section{padding:4px 12px 20px;}
.country-grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:5px;
}
.cell{
  position:relative;border-radius:8px;padding:4px 2px 6px;text-align:center;
  background:linear-gradient(180deg,rgba(26,28,48,.95),rgba(8,9,18,.95));
  border:1.5px solid rgba(255,255,255,.08);min-width:0;
}
.cell.rank-1{border-color:#ffd92e;box-shadow:0 0 12px rgba(255,211,36,.55);}
.cell.rank-2{border-color:#d5d8e3;}
.cell.rank-3{border-color:#c48246;}
.cell-rank{
  position:absolute;top:2px;left:3px;font-size:7.5px;
  font-weight:1000;color:#a4a8c0;
}
.cell.rank-1 .cell-rank,
.cell.rank-2 .cell-rank,
.cell.rank-3 .cell-rank{color:#ffe13b;}
.cell-flag{font-size:22px;line-height:1;margin-top:8px;display:block;}
.cell-points{margin-top:3px;font-size:10px;font-weight:1000;color:#e6e8f2;}
.cell.rank-1 .cell-points,
.cell.rank-2 .cell-points,
.cell.rank-3 .cell-points{color:#ffe02f;}


/* ================= CONTROLS ================= */

.controls{
  position:fixed;right:12px;bottom:12px;z-index:999;
  display:flex;flex-direction:column;gap:7px;
}
.control{
  border:none;padding:9px 13px;border-radius:22px;
  background:#202337;color:#fff;border:1px solid rgba(255,255,255,.15);
  font-size:10px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
}
.control.on{background:#147b4d;}
.connection{
  position:fixed;left:12px;bottom:12px;z-index:999;
  padding:8px 12px;border-radius:20px;background:#202337;
  border:1px solid rgba(255,255,255,.15);
  font-size:9px;font-weight:900;
}
.connection.connected{background:#147b4d;}
.connection.error{background:#8b2020;}


/* ================= RESPONSIVE ================= */

@media(max-width:400px){
  .country-grid{grid-template-columns:repeat(7,1fr);}
  .cell-flag{font-size:19px;}
  .cell-points{font-size:9px;}

  .p-avatar-wrap{width:62px;height:62px;padding:3px;}
  .rank-1 .p-avatar-wrap{width:70px;height:70px;}
  .p-crown{font-size:30px;top:-22px;}
  .rank-2 .p-crown{font-size:26px;top:-19px;}
  .rank-3 .p-crown{font-size:24px;top:-17px;}
  .p-name{font-size:10px;}
  .p-amount{font-size:14px;}
  .player-card{padding:28px 4px 34px;}

  .tc-flag-box{width:52px;height:38px;font-size:26px;}
  .tc-points{font-size:14px;}
  .tc-crown{font-size:24px;top:-18px;}
  .rank-2 .tc-crown{font-size:21px;top:-16px;}
  .rank-3 .tc-crown{font-size:20px;top:-15px;}
  .tc-card{padding:24px 4px 28px;}

  .section-title{margin:16px 0 26px;}
}

</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="title">TYPE YOUR COUNTRY</div>
  </div>

  <div class="rules">
    <div class="rule">💬 1 COMMENT = <span class="yellow">1 POINT</span></div>
    <div class="rule">💎 $1 SUPERCHAT = <span class="yellow">1000 POINTS</span></div>
  </div>

  <div class="section-title">🏆 TOP 3 PLAYERS</div>
  <div class="top-players-wrap">
    <div class="top-players" id="topPlayers"></div>
  </div>

  <div class="section-title">🏆 TOP 3 COUNTRIES</div>
  <div class="top-countries-wrap">
    <div class="top-countries" id="topCountries"></div>
  </div>

  <div class="event-area">
    <div id="event" class="event">Waiting for comments...</div>
  </div>

  <div class="grid-section">
    <div id="countryGrid" class="country-grid"></div>
  </div>

</div>

<div class="controls">
  <button id="musicButton" class="control">🎵 MUSIC OFF</button>
  <button id="voiceButton" class="control on">🔊 VOICE ON</button>
</div>

<div id="connection" class="connection">🔄 CONNECTING...</div>

<audio id="backgroundMusic" src="/music/background.mp3" loop preload="auto"></audio>

function escapeHtml(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatNumber(v){ return Number(v || 0).toLocaleString("en-US"); }
function formatUSD(v){ return "$" + Number(v || 0).toFixed(2); }
function getCountryName(c){ if(!c) return "Unknown"; return c.countryName || "Unknown"; }
function getFlag(c){ if(!c) return "🌍"; return c.flag || "🌍"; }

function setConnectionStatus(ok){
  if(ok){
    connectionEl.textContent = "🟢 YOUTUBE CONNECTED";
    connectionEl.classList.add("connected");
    connectionEl.classList.remove("error");
  }else{
    connectionEl.textContent = "🔴 YOUTUBE DISCONNECTED";
    connectionEl.classList.remove("connected");
    connectionEl.classList.add("error");
  }
}

function startMusic(){
  try{
    music.volume = 0.12;
    var p = music.play();
    if(p && p.then){
      p.then(function(){
        musicEnabled = true;
        musicButton.textContent = "🎵 MUSIC ON";
        musicButton.classList.add("on");
      }).catch(function(){
        musicEnabled = false;
        musicButton.textContent = "🎵 MUSIC OFF";
        musicButton.classList.remove("on");
      });
    }
  }catch(e){ musicEnabled = false; }
}
