<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Country Battle Live</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#07080e;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:auto;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(63,52,150,.38),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #080910 0%,
      #10132d 45%,
      #080910 100%
    );

  overflow:hidden;
  position:relative;
}

/* ================= HEADER ================= */

.header{
  text-align:center;
  padding:25px 12px 8px;
}

.title{
  font-size:clamp(25px,6vw,47px);
  font-weight:1000;
  letter-spacing:1px;
  color:#ffe75b;

  text-shadow:
    0 0 6px rgba(255,230,70,.8),
    0 0 22px rgba(255,210,0,.35);
}

.live{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-top:7px;
  padding:4px 12px;

  border-radius:20px;

  background:rgba(255,0,0,.12);
  border:1px solid rgba(255,80,80,.3);

  color:#ff7272;
  font-size:10px;
  font-weight:900;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff3030;
  box-shadow:0 0 9px #ff3030;

  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.25;
  }
}

/* ================= RULES ================= */

.rules{
  margin:8px 20px 12px;

  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;

  padding:7px 10px;

  border:1px solid rgba(255,225,72,.5);
  border-radius:10px;

  background:rgba(0,0,0,.45);
}

.rule{
  font-size:clamp(9px,2.7vw,16px);
  font-weight:900;
  white-space:nowrap;
}

.yellow{
  color:#ffe13b;
}

/* ================= TOP 3 COUNTRY ================= */

.top-section{
  padding:3px 12px 10px;
}

.top-title{
  text-align:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  margin-bottom:8px;
}

.top-three{
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:7px;
  align-items:end;
}

.top-card{
  min-width:0;
  text-align:center;

  position:relative;

  padding:7px 4px 10px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      rgba(42,43,65,.94),
      rgba(10,11,22,.97)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:0 7px 22px rgba(0,0,0,.4);
}

.top-card.first{
  border-color:#ffd92e;
  box-shadow:
    0 0 18px rgba(255,211,36,.3);
}

.top-card.second{
  border-color:#d5d8e3;
}

.top-card.third{
  border-color:#bd844b;
}

.crown{
  height:25px;
  font-size:22px;
}

.rank{
  position:absolute;
  top:5px;
  right:5px;

  width:23px;
  height:23px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ed2633;
  border:2px solid white;

  font-size:8px;
  font-weight:1000;
}

.country-flag-big{
  width:65px;
  height:65px;

  margin:3px auto 6px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#171927;

  border:2px solid rgba(255,255,255,.5);

  font-family:
    "Noto Color Emoji",
    "Apple Color Emoji",
    "Segoe UI Emoji",
    sans-serif;

  font-size:38px;

  line-height:1;
}

.top-card.first
.country-flag-big{
  border-color:#ffe338;

  box-shadow:
    0 0 14px rgba(255,220,50,.5);
}

.country-top-name{
  max-width:100%;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
  font-weight:1000;
}

.country-top-points{
  margin-top:5px;

  color:#ffe02f;

  font-size:15px;
  font-weight:1000;
}

/* ================= EVENT ================= */

.event-area{
  min-height:54px;

  margin:3px 18px 9px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  background:rgba(0,0,0,.3);

  border:1px solid rgba(255,255,255,.1);

  overflow:hidden;
}

.event{
  width:100%;

  padding:8px;

  text-align:center;

  font-size:12px;
  font-weight:900;
}

.event.comment{
  color:white;
}

.event.superchat{
  color:#ffe02c;

  text-shadow:
    0 0 10px rgba(255,215,0,.35);
}

/* ================= COUNTRY LIST ================= */

.country-section{
  padding:0 12px 90px;
}

.country-header{
  display:grid;
  grid-template-columns:34px 1fr 80px;

  padding:6px 8px;

  color:#777b91;

  font-size:8px;
  font-weight:900;
}

.country-list{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.country-row{
  display:grid;

  grid-template-columns:
    35px 1fr 80px;

  min-height:38px;

  align-items:center;

  padding:3px 7px;

  border-radius:6px;

  background:
    linear-gradient(
      90deg,
      rgba(24,25,45,.9),
      rgba(11,12,23,.75)
    );

  border:1px solid rgba(255,255,255,.04);

  transition:
    transform .2s,
    background .2s;
}

.country-row.top-country{
  border-color:
    rgba(255,218,49,.3);

  background:
    linear-gradient(
      90deg,
      rgba(52,47,20,.75),
      rgba(11,12,23,.9)
    );
}

.country-rank{
  font-size:9px;
  font-weight:900;
  color:#d5d6df;
}

.country-info{
  display:flex;
  align-items:center;
  gap:8px;

  min-width:0;
}

.flag{
  font-family:
    "Noto Color Emoji",
    "Apple Color Emoji",
    "Segoe UI Emoji",
    sans-serif;

  font-size:22px;

  width:28px;
  min-width:28px;

  text-align:center;

  line-height:1;
}

.country-name{
  font-size:11px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.country-points{
  text-align:right;

  color:white;

  font-size:13px;
  font-weight:1000;
}

.top-country .country-points{
  color:#ffe13b;
}

/* ================= CONTROLS ================= */

.controls{
  position:fixed;

  right:12px;
  bottom:12px;

  z-index:999;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.control{
  border:none;

  padding:9px 13px;

  border-radius:22px;

  background:#202337;
  color:white;

  border:1px solid rgba(255,255,255,.15);

  font-size:10px;
  font-weight:900;

  box-shadow:
    0 5px 20px rgba(0,0,0,.4);

  cursor:pointer;
}

.control.on{
  background:#147b4d;
}

.control.voice-error{
  background:#8b2020;
}

/* ================= CONNECTION ================= */

.connection{
  position:fixed;

  left:12px;
  bottom:12px;

  z-index:999;

  padding:8px 12px;

  border-radius:20px;

  background:#202337;

  border:1px solid rgba(255,255,255,.15);

  font-size:9px;
  font-weight:900;
}

.connection.connected{
  background:#147b4d;
}

.connection.error{
  background:#8b2020;
}

/* ================= RESPONSIVE ================= */

@media(max-width:380px){

  .rules{
    margin-left:9px;
    margin-right:9px;
    gap:8px;
  }

  .rule{
    font-size:9px;
  }

  .country-flag-big{
    width:55px;
    height:55px;
    font-size:32px;
  }

  .country-row{
    grid-template-columns:
      30px 1fr 65px;
  }

  .country-header{
    grid-template-columns:
      30px 1fr 65px;
  }

  .country-name{
    font-size:10px;
  }

  .country-points{
    font-size:12px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="title">
      TYPE YOUR COUNTRY
    </div>

    <div class="live">

      <span class="live-dot"></span>

      LIVE COUNTRY BATTLE

    </div>

  </header>


  <!-- RULES -->

  <div class="rules">

    <div class="rule">

      💬 1 COMMENT =

      <span class="yellow">
        1 POINT
      </span>

    </div>

    <div class="rule">

      💎 $1 SUPERCHAT =

      <span class="yellow">
        1000 POINTS
      </span>

    </div>

  </div>


  <!-- TOP 3 COUNTRIES -->

  <section class="top-section">

    <div class="top-title">
      🏆 TOP 3 COUNTRIES
    </div>

    <div
      id="topThree"
      class="top-three">
    </div>

  </section>


  <!-- LAST EVENT -->

  <div class="event-area">

    <div
      id="event"
      class="event">

      Waiting for comments...

    </div>

  </div>


  <!-- COUNTRY LIST -->

  <section class="country-section">

    <div class="country-header">

      <span>#</span>

      <span>COUNTRY</span>

      <span>POINTS</span>

    </div>

    <div
      id="countryList"
      class="country-list">

      <div class="empty">
        Loading countries...
      </div>

    </div>

  </section>

</div>


<!-- CONTROLS -->

<div class="controls">

  <button
    id="voiceButton"
    class="control">

    🔊 ENABLE VOICE

  </button>

</div>


<!-- CONNECTION -->

<div
  id="connection"
  class="connection">

  🔄 CONNECTING...

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "/api/state";

const POLL_INTERVAL =
  2000;


/* =====================================================
   ELEMENTS
===================================================== */

const voiceButton =
  document.getElementById(
    "voiceButton"
  );

const eventElement =
  document.getElementById(
    "event"
  );

const countryList =
  document.getElementById(
    "countryList"
  );

const topThree =
  document.getElementById(
    "topThree"
  );

const connection =
  document.getElementById(
    "connection"
  );


/* =====================================================
   VOICE STATE
===================================================== */

let voiceEnabled = false;

let voiceReady = false;

let firstStateLoaded = false;

let lastEventId = "";

let loading = false;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(value){

  return Number(
    value || 0
  ).toLocaleString(
    "en-US"
  );

}


/* =====================================================
   COUNTRY NAME
===================================================== */

function getCountryName(country){

  if(!country){
    return "Unknown country";
  }

  return (
    country.countryName ||
    country.name ||
    country.country ||
    "Unknown country"
  );

}


/* =====================================================
   FLAG
===================================================== */

function getFlag(country){

  if(!country){
    return "🌍";
  }

  return (
    country.flag ||
    country.countryFlag ||
    country.emoji ||
    "🌍"
  );

}


/* =====================================================
   CONNECTION
===================================================== */

function setConnectionStatus(
  connected
){

  if(connected){

    connection.textContent =
      "🟢 YOUTUBE CONNECTED";

    connection.classList.add(
      "connected"
    );

    connection.classList.remove(
      "error"
    );

  }else{

    connection.textContent =
      "🔴 YOUTUBE DISCONNECTED";

    connection.classList.remove(
      "connected"
    );

    connection.classList.add(
      "error"
    );

  }

}


/* =====================================================
   VOICE SUPPORT
===================================================== */

function hasVoiceSupport(){

  return (
    "speechSynthesis"
    in window &&
    "SpeechSynthesisUtterance"
    in window
  );

}


/* =====================================================
   GET BEST VOICE
===================================================== */

function getBestVoice(){

  if(!hasVoiceSupport()){
    return null;
  }

  const voices =
    speechSynthesis.getVoices();

  if(!voices.length){
    return null;
  }

  return (
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase()
          .startsWith("en-us")
    ) ||

    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase()
          .startsWith("en")
    ) ||

    voices[0]
  );

}


/* =====================================================
   VOICE STATUS
===================================================== */

function setVoiceButton(
  text,
  enabled,
  error = false
){

  voiceButton.textContent =
    text;

  voiceButton.classList.toggle(
    "on",
    enabled
  );

  voiceButton.classList.toggle(
    "voice-error",
    error
  );

}


/* =====================================================
   UNLOCK VOICE
===================================================== */

function unlockVoice(){

  if(!hasVoiceSupport()){

    voiceReady = false;

    setVoiceButton(
      "❌ VOICE NOT SUPPORTED",
      false,
      true
    );

    console.error(
      "Speech Synthesis is not supported by this browser."
    );

    return false;

  }


  try{

    speechSynthesis.cancel();

    const test =
      new SpeechSynthesisUtterance(
        "Voice enabled"
      );

    test.lang =
      "en-US";

    test.rate =
      0.9;

    test.pitch =
      1;

    test.volume =
      1;

    const voice =
      getBestVoice();

    if(voice){
      test.voice = voice;
    }

    speechSynthesis.speak(
      test
    );

    voiceEnabled = true;

    voiceReady = true;

    setVoiceButton(
      "🔊 VOICE ON",
      true,
      false
    );

    return true;

  }catch(error){

    console.error(
      "VOICE UNLOCK ERROR:",
      error
    );

    voiceReady = false;

    setVoiceButton(
      "❌ VOICE ERROR",
      false,
      true
    );

    return false;

  }

}


/* =====================================================
   VOICE BUTTON
===================================================== */

voiceButton.addEventListener(
  "click",
  () => {

    if(!voiceEnabled){

      unlockVoice();

      return;

    }


    voiceEnabled = false;

    voiceReady = false;

    if(hasVoiceSupport()){

      speechSynthesis.cancel();

    }

    setVoiceButton(
      "🔇 VOICE OFF",
      false,
      false
    );

  }
);


/* =====================================================
   LOAD VOICES
===================================================== */

if(hasVoiceSupport()){

  speechSynthesis.onvoiceschanged =
    () => {

      getBestVoice();

    };

}


/* =====================================================
   SPEAK
===================================================== */

function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(!voiceReady){
    return;
  }

  if(!hasVoiceSupport()){
    return;
  }

  if(!text){
    return;
  }


  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        String(text)
      );


    utterance.lang =
      "en-US";

    utterance.rate =
      0.88;

    utterance.pitch =
      1;

    utterance.volume =
      1;


    const voice =
      getBestVoice();

    if(voice){
      utterance.voice =
        voice;
    }


    speechSynthesis.speak(
      utterance
    );


  }catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );

  }

}


/* =====================================================
   ANNOUNCE EVENT
===================================================== */

function announceEvent(event){

  if(!event){
    return;
  }

  if(!event.id){
    return;
  }


  /*
    First event after page load
    will NOT be spoken.
  */

  if(!firstStateLoaded){

    lastEventId =
      event.id;

    firstStateLoaded = true;

    return;

  }


  if(
    event.id ===
    lastEventId
  ){

    return;

  }


  lastEventId =
    event.id;


  const name =
    event.displayName ||
    "Someone";


  const country =
    event.countryName ||
    event.country ||
    "Unknown country";


  const points =
    Number(
      event.points || 0
    );


  /* ===============================
     SUPER CHAT
  =============================== */

  if(
    event.type ===
    "superchat"
  ){

    const amount =
      Number(
        event.amountMicros ||
        0
      ) / 1000000;


    const currency =
      event.currency ||
      "USD";


    const amountText =
      amount > 0
        ? `${amount.toFixed(2)} ${currency}`
        : "Super Chat";


    speak(
      `${name}. ` +
      `${country}. ` +
      `${amountText}. ` +
      `${formatNumber(points)} points.`
    );

    return;

  }


  /* ===============================
     NORMAL COMMENT
  =============================== */

  if(
    event.type ===
    "comment"
  ){

    if(points > 0){

      speak(
        `${name}. ` +
        `${country}. ` +
        `${formatNumber(points)} point.`
      );

    }

  }

}


/* =====================================================
   RENDER EVENT
===================================================== */

function renderEvent(event){

  if(
    !event ||
    !event.id
  ){

    eventElement.className =
      "event";

    eventElement.textContent =
      "Waiting for comments...";

    return;

  }


  const name =
    event.displayName ||
    "Someone";


  const country =
    event.countryName ||
    event.country ||
    "Unknown country";


  const points =
    Number(
      event.points || 0
    );


  /* ===============================
     SUPER CHAT
  =============================== */

  if(
    event.type ===
    "superchat"
  ){

    const amount =
      Number(
        event.amountMicros ||
        0
      ) / 1000000;


    const currency =
      event.currency ||
      "USD";


    eventElement.className =
      "event superchat";


    eventElement.innerHTML = `

      💎

      <strong>
        ${escapeHtml(name)}
      </strong>

      sent

      <strong>
        ${amount.toFixed(2)}
        ${escapeHtml(currency)}
      </strong>

      ·

      <strong>
        ${formatNumber(points)}
        POINTS
      </strong>

      ·

      ${escapeHtml(country)}

    `;

    return;

  }


  /* ===============================
     COMMENT
  =============================== */

  eventElement.className =
    "event comment";


  if(points > 0){

    eventElement.innerHTML = `

      💬

      <strong>
        ${escapeHtml(name)}
      </strong>

      ·

      ${escapeHtml(country)}

      ·

      <strong>
        +${formatNumber(points)}
        POINT
      </strong>

    `;

  }else{

    eventElement.innerHTML = `

      💬

      <strong>
        ${escapeHtml(name)}
      </strong>

      commented

    `;

  }

}


/* =====================================================
   RENDER TOP 3 COUNTRIES
===================================================== */

function renderTop3(countries){

  const list =
    Array.isArray(countries)
      ? countries
      : [];


  const sorted =
    [...list]
      .filter(Boolean)
      .map(
        country => ({

          ...country,

          score:
            Number(
              country.score ??
              country.points ??
              0
            )

        })
      )
      .sort(
        (a,b) =>
          b.score -
          a.score
      )
      .slice(0,3);


  const classes = [
    "second",
    "first",
    "third"
  ];


  const crowns = [
    "🥈",
    "👑",
    "🥉"
  ];


  let html = "";


  for(
    let slot = 0;
    slot < 3;
    slot++
  ){

    const country =
      sorted[slot];


    if(!country){

      html += `

        <div class="
          top-card
          ${classes[slot]}
        ">

          <div class="crown">
            ${crowns[slot]}
          </div>

          <div class="country-flag-big">
            🌍
          </div>

          <div class="country-top-name">
            Waiting...
          </div>

          <div class="country-top-points">
            0 POINT
          </div>

        </div>

      `;

      continue;

    }


    const flag =
      getFlag(country);


    const name =
      getCountryName(country);


    const score =
      Number(
        country.score ??
        country.points ??
        0
      );


    html += `

      <div class="
        top-card
        ${classes[slot]}
      ">

        <div class="rank">
          #${slot + 1}
        </div>

        <div class="crown">
          ${crowns[slot]}
        </div>

        <div class="country-flag-big">
          ${escapeHtml(flag)}
        </div>

        <div class="country-top-name">
          ${escapeHtml(name)}
        </div>

        <div class="country-top-points">
          ${formatNumber(score)}
          POINT${score === 1 ? "" : "S"}
        </div>

      </div>

    `;

  }


  topThree.innerHTML =
    html;

}


/* =====================================================
   RENDER ALL 195 COUNTRIES
===================================================== */

function renderCountries(
  countries
){

  let list =
    Array.isArray(countries)
      ? [...countries]
      : [];


  list =
    list
      .map(
        country => ({

          ...country,

          score:
            Number(
              country.score ??
              country.points ??
              0
            )

        })
      )
      .sort(
        (a,b) => {

          if(
            b.score !==
            a.score
          ){

            return (
              b.score -
              a.score
            );

          }

          return getCountryName(a)
            .localeCompare(
              getCountryName(b)
            );

        }
      );


  if(!list.length){

    countryList.innerHTML = `

      <div class="empty">
        No countries received yet.
      </div>

    `;

    return;

  }


  let html = "";


  list.forEach(
    (country,index) => {

      const name =
        getCountryName(
          country
        );


      const flag =
        getFlag(
          country
        );


      const score =
        Number(
          country.score || 0
        );


      const isTop =
        index < 3 &&
        score > 0;


      html += `

        <div class="
          country-row
          ${isTop ? "top-country" : ""}
        ">

          <div class="country-rank">

            #${index + 1}

          </div>

          <div class="country-info">

            <div class="flag">

              ${escapeHtml(flag)}

            </div>

            <div class="country-name">

              ${escapeHtml(name)}

            </div>

          </div>

          <div class="country-points">

            ${formatNumber(score)}

          </div>

        </div>

      `;

    }
  );


  countryList.innerHTML =
    html;

}


/* =====================================================
   FETCH STATE
===================================================== */

async function loadState(){

  if(loading){
    return;
  }

  loading = true;


  try{

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      Server sends:
      countries
      players
      lastEvent
      connected
    */


    const countries =
      Array.isArray(
        data.countries
      )
        ? data.countries
        : [];


    const event =
      data.lastEvent ||
      null;


    renderTop3(
      countries
    );


    renderCountries(
      countries
    );


    renderEvent(
      event
    );


    announceEvent(
      event
    );


    setConnectionStatus(
      data.connected !== false
    );


  }catch(error){

    console.error(
      "STATE ERROR:",
      error
    );


    setConnectionStatus(
      false
    );

  }finally{

    loading = false;

  }

}


/* =====================================================
   START
===================================================== */

loadState();


setInterval(
  loadState,
  POLL_INTERVAL
);


/* =====================================================
   MOBILE / BROWSER VOICE PREP
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden &&
      hasVoiceSupport()
    ){

      speechSynthesis.cancel();

    }

  }
);

</script>
