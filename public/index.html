<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Country Battle Live</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#07080e;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:auto;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(63,52,150,.38),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #080910 0%,
      #10132d 45%,
      #080910 100%
    );

  overflow:hidden;
  position:relative;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  text-align:center;
  padding:25px 12px 8px;
}

.title{
  font-size:clamp(25px,6vw,47px);
  font-weight:1000;
  letter-spacing:1px;
  color:#ffe75b;

  text-shadow:
    0 0 6px rgba(255,230,70,.8),
    0 0 22px rgba(255,210,0,.35);
}

.live{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-top:7px;
  padding:4px 12px;

  border-radius:20px;

  background:rgba(255,0,0,.12);
  border:1px solid rgba(255,80,80,.3);

  color:#ff7272;

  font-size:10px;
  font-weight:900;
}

.live-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff3030;

  box-shadow:0 0 9px #ff3030;

  animation:pulse 1s infinite;
}

@keyframes pulse{

  50%{
    opacity:.25;
  }

}


/* =====================================================
   RULES
===================================================== */

.rules{
  margin:8px 20px 12px;

  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:15px;

  padding:7px 10px;

  border:1px solid rgba(255,225,72,.5);

  border-radius:10px;

  background:rgba(0,0,0,.45);
}

.rule{
  font-size:clamp(9px,2.7vw,16px);

  font-weight:900;

  white-space:nowrap;
}

.yellow{
  color:#ffe13b;
}


/* =====================================================
   TOP 3
===================================================== */

.top-section{
  padding:3px 12px 10px;
}

.top-title{
  text-align:center;

  font-size:11px;

  font-weight:900;

  letter-spacing:1.5px;

  margin-bottom:8px;
}

.top-three{

  display:grid;

  grid-template-columns:
    1fr
    1.15fr
    1fr;

  gap:7px;

  align-items:end;
}

.top-card{

  min-width:0;

  text-align:center;

  position:relative;

  padding:7px 4px 9px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      rgba(42,43,65,.94),
      rgba(10,11,22,.97)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 7px 22px rgba(0,0,0,.4);
}

.top-card.first{

  border-color:#ffd92e;

  box-shadow:
    0 0 18px rgba(255,211,36,.3);
}

.top-card.second{
  border-color:#d5d8e3;
}

.top-card.third{
  border-color:#bd844b;
}

.crown{

  height:25px;

  font-size:22px;
}

.rank{

  position:absolute;

  top:5px;
  right:5px;

  width:21px;
  height:21px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#ed2633;

  border:2px solid white;

  font-size:9px;

  font-weight:1000;
}

.avatar{

  width:60px;
  height:60px;

  margin:3px auto 5px;

  border-radius:13px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:28px;

  background:#171927;

  border:2px solid rgba(255,255,255,.5);
}

.top-card.first .avatar{

  border-color:#ffe338;

  box-shadow:
    0 0 14px rgba(255,220,50,.5);
}

.player-name{

  max-width:100%;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:11px;

  font-weight:900;
}

.player-country{

  margin-top:3px;

  font-size:10px;

  color:#bfc1cc;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.player-points{

  margin-top:4px;

  color:#ffe02f;

  font-size:15px;

  font-weight:1000;
}


/* =====================================================
   EVENT
===================================================== */

.event-area{

  min-height:52px;

  margin:3px 18px 9px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:9px;

  background:rgba(0,0,0,.3);

  border:1px solid rgba(255,255,255,.1);

  overflow:hidden;
}

.event{

  width:100%;

  padding:8px;

  text-align:center;

  font-size:12px;

  font-weight:900;
}

.event.comment{
  color:white;
}

.event.superchat{

  color:#ffe02c;

  text-shadow:
    0 0 10px rgba(255,215,0,.35);
}


/* =====================================================
   VOICE ACTIVE EFFECT
===================================================== */

.event.speaking{

  animation:
    voicePulse .5s ease-in-out infinite alternate;
}

@keyframes voicePulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.02);
  }

}


/* =====================================================
   COUNTRY LIST
===================================================== */

.country-section{
  padding:0 12px 25px;
}

.country-header{

  display:grid;

  grid-template-columns:
    34px
    1fr
    70px;

  padding:6px 8px;

  color:#777b91;

  font-size:8px;

  font-weight:900;
}

.country-list{

  display:flex;

  flex-direction:column;

  gap:3px;
}

.country-row{

  display:grid;

  grid-template-columns:
    35px
    1fr
    70px;

  min-height:34px;

  align-items:center;

  padding:3px 7px;

  border-radius:6px;

  background:
    linear-gradient(
      90deg,
      rgba(24,25,45,.9),
      rgba(11,12,23,.75)
    );

  border:1px solid rgba(255,255,255,.04);
}

.country-rank{

  font-size:8px;

  font-weight:900;

  color:#d5d6df;
}

.country-info{

  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;
}

.flag{

  font-size:20px;

  width:26px;

  min-width:26px;

  text-align:center;
}

.country-name{

  font-size:11px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.country-points{

  text-align:right;

  color:white;

  font-size:13px;

  font-weight:1000;
}

.top-country{

  border-color:
    rgba(255,218,49,.22);
}

.top-country .country-points{

  color:#ffe13b;
}

.empty{

  padding:18px;

  text-align:center;

  color:#6f7283;

  font-size:12px;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

  position:fixed;

  right:12px;
  bottom:12px;

  z-index:999;

  display:flex;

  flex-direction:column;

  gap:7px;
}

.control{

  border:none;

  padding:9px 13px;

  border-radius:22px;

  background:#202337;

  color:white;

  border:1px solid rgba(255,255,255,.15);

  font-size:10px;

  font-weight:900;

  box-shadow:
    0 5px 20px rgba(0,0,0,.4);

  cursor:pointer;
}

.control.on{

  background:#147b4d;
}


/* =====================================================
   CONNECTION
===================================================== */

.connection{

  position:fixed;

  left:12px;
  bottom:12px;

  z-index:999;

  padding:8px 12px;

  border-radius:20px;

  background:#202337;

  border:1px solid rgba(255,255,255,.15);

  font-size:9px;

  font-weight:900;
}

.connection.connected{

  background:#147b4d;
}

.connection.error{

  background:#8b2020;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:380px){

  .rules{

    margin-left:9px;
    margin-right:9px;

    gap:8px;
  }

  .rule{
    font-size:9px;
  }

  .avatar{

    width:52px;
    height:52px;

    font-size:25px;
  }

  .player-name{
    font-size:9px;
  }

  .country-row{

    grid-template-columns:
      30px
      1fr
      60px;
  }

  .country-name{
    font-size:10px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">

    <div class="title">
      TYPE YOUR COUNTRY
    </div>

    <div class="live">

      <span class="live-dot"></span>

      LIVE COUNTRY BATTLE

    </div>

  </header>


  <!-- =================================================
       RULES
  ================================================== -->

  <div class="rules">

    <div class="rule">

      💬 1 COMMENT =

      <span class="yellow">
        1 POINT
      </span>

    </div>

    <div class="rule">

      💎 $1 SUPERCHAT =

      <span class="yellow">
        1000 POINTS
      </span>

    </div>

  </div>


  <!-- =================================================
       TOP 3
  ================================================== -->

  <section class="top-section">

    <div class="top-title">
      🏆 TOP 3 PLAYERS
    </div>

    <div
      id="topThree"
      class="top-three">
    </div>

  </section>


  <!-- =================================================
       EVENT
  ================================================== -->

  <div class="event-area">

    <div
      id="event"
      class="event">

      Waiting for comments...

    </div>

  </div>


  <!-- =================================================
       COUNTRY LIST
  ================================================== -->

  <section class="country-section">

    <div class="country-header">

      <span>#</span>

      <span>COUNTRY</span>

      <span>POINTS</span>

    </div>

    <div
      id="countryList"
      class="country-list">

      <div class="empty">
        Loading countries...
      </div>

    </div>

  </section>

</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

  <button
    id="voiceButton"
    class="control on">

    🔊 VOICE ON

  </button>

</div>


<!-- =====================================================
     CONNECTION
===================================================== -->

<div
  id="connection"
  class="connection">

  🔄 CONNECTING...

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "/api/state";

const POLL_INTERVAL =
  2000;


/* =====================================================
   ELEMENTS
===================================================== */

const voiceButton =
  document.getElementById(
    "voiceButton"
  );

const eventElement =
  document.getElementById(
    "event"
  );

const countryList =
  document.getElementById(
    "countryList"
  );

const topThree =
  document.getElementById(
    "topThree"
  );

const connection =
  document.getElementById(
    "connection"
  );


/* =====================================================
   STATE
===================================================== */

let voiceEnabled = true;

let lastEventId = "";

let firstStateLoaded = false;

let loading = false;


/*
  This flag is important for
  Browser Source / streaming apps.

  The browser may block speech until
  the page has received a user gesture.
*/

let speechUnlocked = false;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value){

  return Number(
    value || 0
  ).toLocaleString(
    "en-US"
  );

}


/* =====================================================
   COUNTRY NAME
===================================================== */

function getCountryName(country){

  if(!country){
    return "Unknown country";
  }

  return (
    country.countryName ||
    country.name ||
    country.country ||
    "Unknown country"
  );

}


/* =====================================================
   FLAG
===================================================== */

function getFlag(country){

  if(!country){
    return "🌍";
  }

  return (
    country.flag ||
    country.countryFlag ||
    country.emoji ||
    "🌍"
  );

}


/* =====================================================
   CONNECTION STATUS
===================================================== */

function setConnectionStatus(
  connected
){

  if(connected){

    connection.textContent =
      "🟢 YOUTUBE CONNECTED";

    connection.classList.add(
      "connected"
    );

    connection.classList.remove(
      "error"
    );

  }else{

    connection.textContent =
      "🔴 YOUTUBE DISCONNECTED";

    connection.classList.remove(
      "connected"
    );

    connection.classList.add(
      "error"
    );

  }

}


/* =====================================================
   UNLOCK VOICE
===================================================== */

function unlockVoice(){

  speechUnlocked = true;

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }

  /*
    Some browsers need a tiny speech
    action before they allow later
    automatic speech.
  */

  try{

    speechSynthesis.cancel();

  }catch(error){

    console.log(
      "Speech unlock error:",
      error
    );

  }

}


/* =====================================================
   USER INTERACTION
===================================================== */

document.addEventListener(
  "click",
  unlockVoice,
  {
    passive:true
  }
);

document.addEventListener(
  "touchstart",
  unlockVoice,
  {
    passive:true
  }
);


/* =====================================================
   VOICE BUTTON
===================================================== */

voiceButton.addEventListener(
  "click",
  function(){

    unlockVoice();

    voiceEnabled =
      !voiceEnabled;

    if(!voiceEnabled){

      if(
        "speechSynthesis"
        in window
      ){

        speechSynthesis.cancel();

      }

      voiceButton.textContent =
        "🔇 VOICE OFF";

      voiceButton.classList.remove(
        "on"
      );

    }else{

      voiceButton.textContent =
        "🔊 VOICE ON";

      voiceButton.classList.add(
        "on"
      );

      /*
        Small confirmation voice.
      */

      speak(
        "Voice on"
      );

    }

  }
);


/* =====================================================
   SPEAK
===================================================== */

function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(
    !("speechSynthesis" in window)
  ){

    console.error(
      "Speech Synthesis is not supported."
    );

    return;

  }


  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        String(text)
      );


    /*
      English voice.
    */

    utterance.lang =
      "en-US";


    /*
      Natural speed.
    */

    utterance.rate =
      0.88;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    eventElement.classList.add(
      "speaking"
    );


    utterance.onend =
      function(){

        eventElement.classList.remove(
          "speaking"
        );

      };


    utterance.onerror =
      function(error){

        console.error(
          "VOICE ERROR:",
          error
        );

        eventElement.classList.remove(
          "speaking"
        );

      };


    speechSynthesis.speak(
      utterance
    );

  }catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );

  }

}


/* =====================================================
   ANNOUNCE EVENT
===================================================== */

function announceEvent(event){

  if(!event){
    return;
  }

  if(!event.id){
    return;
  }


  /*
    Do not speak the existing event
    when the page first opens.
  */

  if(!firstStateLoaded){

    lastEventId =
      event.id;

    return;

  }


  /*
    Same event = don't speak again.
  */

  if(
    event.id ===
    lastEventId
  ){

    return;

  }


  lastEventId =
    event.id;


  /*
    Ignore events that don't contain
    a country.
  */

  if(
    event.hasCountry === false
  ){

    return;

  }


  const name =
    event.displayName ||
    "Someone";


  const country =
    event.countryName ||
    event.country ||
    "Unknown country";


  const points =
    Number(
      event.points || 0
    );


  /* =================================================
     SUPER CHAT
  ================================================= */

  if(
    event.type ===
    "superchat"
  ){

    const amount =
      Number(
        event.amount ??
        (
          Number(
            event.amountMicros ||
            0
          ) /
          1000000
        )
      );


    const currency =
      event.currency ||
      "USD";


    speak(
      `Super Chat from ${name}. ` +
      `${country}. ` +
      `${formatNumber(points)} points.`
    );

    return;

  }


  /* =================================================
     NORMAL COMMENT
  ================================================= */

  if(
    event.type ===
    "comment"
  ){

    /*
      EXACT VOICE FORMAT:

      John. India. One point.
    */

    speak(
      `${name}. ` +
      `${country}. ` +
      `${points === 1
        ? "One point."
        : `${formatNumber(points)} points.`
      }`
    );

  }

}


/* =====================================================
   RENDER EVENT
===================================================== */

function renderEvent(event){

  if(
    !event ||
    !event.id
  ){

    eventElement.className =
      "event";

    eventElement.textContent =
      "Waiting for comments...";

    return;

  }


  const name =
    event.displayName ||
    "Someone";


  const country =
    event.countryName ||
    event.country ||
    "Unknown country";


  const points =
    Number(
      event.points || 0
    );


  /* =================================================
     SUPER CHAT
  ================================================= */

  if(
    event.type ===
    "superchat"
  ){

    const amount =
      Number(
        event.amount ??
        (
          Number(
            event.amountMicros ||
            0
          ) /
          1000000
        )
      );


    const currency =
      event.currency ||
      "USD";


    eventElement.className =
      "event superchat";


    eventElement.innerHTML = `

      💎

      <strong>
        ${escapeHtml(name)}
      </strong>

      sent

      <strong>
        ${amount.toFixed(2)}
        ${escapeHtml(currency)}
      </strong>

      ·

      ${formatNumber(points)}
      POINTS

      ·

      ${escapeHtml(country)}

    `;

    return;

  }


  /* =================================================
     COMMENT
  ================================================= */

  eventElement.className =
    "event comment";


  if(points > 0){

    eventElement.innerHTML = `

      💬

      <strong>
        ${escapeHtml(name)}
      </strong>

      ·

      ${escapeHtml(country)}

      ·

      <strong>
        +${formatNumber(points)}
        POINT
      </strong>

    `;

  }else{

    eventElement.innerHTML = `

      💬

      <strong>
        ${escapeHtml(name)}
      </strong>

      commented

    `;

  }

}


/* =====================================================
   RENDER TOP 3
===================================================== */

function renderTop3(players){

  const list =
    Array.isArray(players)
      ? players
      : [];


  const sorted =
    [...list]
      .filter(Boolean)
      .sort(
        (a,b) =>
          Number(b.score || 0) -
          Number(a.score || 0)
      )
      .slice(
        0,
        3
      );


  const positions = [
    1,
    0,
    2
  ];


  const classes = [
    "second",
    "first",
    "third"
  ];


  const crowns = [
    "♛",
    "👑",
    "♛"
  ];


  let html = "";


  for(
    let slot = 0;
    slot < 3;
    slot++
  ){

    const player =
      sorted[
        positions[slot]
      ];


    if(!player){

      html += `

        <div class="top-card ${classes[slot]}">

          <div class="crown">
            ${crowns[slot]}
          </div>

          <div class="avatar">
            👤
          </div>

          <div class="player-name">
            Waiting...
          </div>

          <div class="player-country">
            —
          </div>

          <div class="player-points">
            0
          </div>

        </div>

      `;

      continue;

    }


    const flag =
      getFlag(player);


    const country =
      getCountryName(player);


    html += `

      <div class="top-card ${classes[slot]}">

        <div class="rank">
          #${positions[slot] + 1}
        </div>

        <div class="crown">
          ${crowns[slot]}
        </div>

        <div class="avatar">
          ${escapeHtml(flag)}
        </div>

        <div class="player-name">
          ${escapeHtml(
            player.displayName ||
            "Player"
          )}
        </div>

        <div class="player-country">

          ${escapeHtml(flag)}

          ${escapeHtml(country)}

        </div>

        <div class="player-points">

          ${formatNumber(
            player.score
          )}

        </div>

      </div>

    `;

  }


  topThree.innerHTML =
    html;

}


/* =====================================================
   RENDER COUNTRIES
===================================================== */

function renderCountries(
  countries
){

  let list =
    Array.isArray(countries)
      ? [...countries]
      : [];


  list =
    list
      .map(
        country => ({

          ...country,

          score:
            Number(
              country.score ??
              country.points ??
              0
            )

        })
      )
      .sort(
        (a,b) => {

          if(
            b.score !==
            a.score
          ){

            return (
              b.score -
              a.score
            );

          }

          return getCountryName(a)
            .localeCompare(
              getCountryName(b)
            );

        }
      );


  if(!list.length){

    countryList.innerHTML = `

      <div class="empty">
        No countries available.
      </div>

    `;

    return;

  }


  let html = "";


  list.forEach(
    (country,index) => {

      const flag =
        getFlag(country);


      const name =
        getCountryName(country);


      const score =
        Number(
          country.score || 0
        );


      html += `

        <div
          class="country-row ${
            score > 0 &&
            index < 3
              ? "top-country"
              : ""
          }"
        >

          <div class="country-rank">

            #${index + 1}

          </div>


          <div class="country-info">

            <div class="flag">

              ${escapeHtml(flag)}

            </div>

            <div class="country-name">

              ${escapeHtml(name)}

            </div>

          </div>


          <div class="country-points">

            ${formatNumber(score)}

          </div>

        </div>

      `;

    }
  );


  countryList.innerHTML =
    html;

}


/* =====================================================
   FETCH STATE
===================================================== */

async function fetchState(){

  if(loading){
    return;
  }


  loading = true;


  try{

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    setConnectionStatus(
      Boolean(
        data.liveChatConnected
      )
    );


    renderCountries(
      data.countries
    );


    renderTop3(
      data.players
    );


    renderEvent(
      data.lastEvent
    );


    /*
      Speak ONLY when there is a
      genuinely new event.
    */

    announceEvent(
      data.lastEvent
    );


    firstStateLoaded =
      true;


  }catch(error){

    console.error(
      "STATE ERROR:",
      error
    );


    setConnectionStatus(
      false
    );

  }finally{

    loading = false;

  }

}


/* =====================================================
   START
===================================================== */

fetchState();


setInterval(
  fetchState,
  POLL_INTERVAL
);


/* =====================================================
   VISIBILITY CHANGE
===================================================== */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      !document.hidden
    ){

      fetchState();

    }

  }
);

</script>
